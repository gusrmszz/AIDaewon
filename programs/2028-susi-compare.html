    &lt;h2&gt;석차등급 환산점수 격차 비교 (5등급제, 1등급 = 100)&lt;/h2&gt;
    &lt;p class=&quot;d&quot;&gt;대학마다 만점 단위(100·1,000 등)가 달라 1등급 점수를 100으로 맞춰 비교했습니다. 신규 수록 대학 중 등급별 점수표가 시행계획에 실린 곳을 함께 넣었고, 기본점수가 큰 대학(경상국립대 등)은 실질 반영 부분만 비교했습니다. 수치가 낮을수록 해당 등급의 감점이 큽니다. 연세·충남·충북·아주 등 성취도를 합산하는 대학은 &lt;b&gt;석차등급 부분만&lt;/b&gt; 비교한 값입니다.&lt;/p&gt;
    &lt;p class=&quot;d&quot; id=&quot;hmCnt&quot; style=&quot;margin-top:6px;font-size:14.83px&quot;&gt;&lt;/p&gt;
