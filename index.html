<!-- 글씨체: Pretendard 1종 (불러오지 못하면 Noto Sans KR → 시스템 글꼴 순으로 대체) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ====================================================================
   디자인 규칙 — 모든 단계에서 유지
   ==================================================================== */
:root {
  /* 기본 색 3가지 (사진 제외) */
  --bg:    #FFFFFF;  /* 바탕 */
  --ink:   #111111;  /* 글자, 선택된 버튼, 아이콘, 현재 메뉴 막대 */
  --mist:  #E9E7E2;  /* 검색창·칩·빈 이미지 자리·구분선 */

  /* 포인트 색 1가지 — 꼭 필요한 곳에만 (제목 위 강조선, 마우스 올림 밑줄, 새 글·주의 표시)
     흰 바탕 대비 4.9:1이라 짧은 글자에도 쓸 수 있지만, 넓은 면이나 긴 글에는 쓰지 않음 */
  --point: #D92B2B;

  /* 보조 글자 — 새 색이 아니라 --ink 60% 투명도 (흰 바탕 5.0:1, --mist 바탕 4.6:1) */
  --sub: rgba(17, 17, 17, 0.6);

  /* 글씨 */
  --font: 'Pretendard Variable', Pretendard, 'Noto Sans KR', system-ui, -apple-system,
          'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --fs-hero:  clamp(40px, 2.5vw + 24px, 56px); /* 큰 제목 */
  --fs-board: 36px;  /* 보드 제목 */
  --fs-sub:   20px;  /* 소제목 */
  --fs-body:  16px;  /* 본문 */
  --fs-aux:   13px;  /* 보조 */

  /* 모서리 */
  --r-card:   16px;  /* 이미지 카드 */
  --r-detail: 32px;  /* 상세 카드 */
  --r-field:  16px;  /* 검색창·칩 */
  --r-pill:   999px; /* 버튼 */

  /* 틀 */
  --nav-w: 72px;
  --tab-h: 64px;
  --t: 0.2s;         /* 움직임은 0.2초 이내 */
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-body);
  font-weight: 400;
  line-height: 1.6;
  word-break: keep-all;
  overflow-wrap: break-word;
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* 본문 바로가기 */
.skip {
  position: fixed; top: 8px; left: 8px; z-index: 100;
  padding: 8px 16px; border-radius: var(--r-pill);
  background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600;
  transform: translateY(-160%); transition: transform var(--t);
}
.skip:focus { transform: none; }

/* ---------- 왼쪽 세로 메뉴 ---------- */
.nav {
  position: fixed; inset: 0 auto 0 0; z-index: 30;
  width: var(--nav-w);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 16px 0;
  background: var(--bg);
  border-right: 1px solid var(--mist);
}
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.mark {
  position: relative;
  width: 48px; height: 48px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--ink); color: var(--bg);
  font-size: var(--fs-aux); font-weight: 700; letter-spacing: -0.02em;
  text-decoration: none;
  margin-bottom: 16px;
}
.nav-item {
  position: relative;
  width: 56px; height: 56px; border-radius: var(--r-field);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  color: var(--ink); text-decoration: none;
  transition: background-color var(--t);
}
.nav-item:hover { background: var(--mist); }
.nav-item svg { width: 24px; height: 24px; }
.nav-item .bar {
  width: 16px; height: 2px; border-radius: 2px;
  background: var(--ink); opacity: 0;
  transition: opacity var(--t);
}
.nav-item[aria-current="page"] .bar { opacity: 1; }
.nav-item .label { display: none; }

/* 마우스를 올리면 오른쪽 이름 말풍선 */
.tip {
  position: absolute; left: calc(100% + 8px); top: 50%;
  transform: translateY(-50%);
  padding: 8px 16px; border-radius: 8px;
  background: var(--ink); color: var(--bg);
  font-size: var(--fs-aux); font-weight: 600; line-height: 1.4; white-space: nowrap;
  opacity: 0; pointer-events: none;
  transition: opacity var(--t);
}
.nav-item:hover .tip, .nav-item:focus-visible .tip,
.mark:hover .tip, .mark:focus-visible .tip { opacity: 1; }

/* ---------- 위쪽 검색창 ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  margin-left: var(--nav-w);
  padding: 16px 24px;
  background: var(--bg);
  display: flex; align-items: center; gap: 16px;
}
.top .mark { display: none; }
.search {
  flex: 1; min-width: 0; margin: 0;
  height: 48px; border-radius: var(--r-field);
  background: var(--mist);
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px;
}
.search:focus-within { outline: 2px solid var(--ink); outline-offset: 0; }
.search svg { width: 20px; height: 20px; flex: none; color: var(--sub); }

}
.search input::placeholder { color: var(--sub); opacity: 1; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ---------- 본문 ---------- */
.main {
  margin-left: var(--nav-w);
  padding: 32px 24px 96px;
  min-height: calc(100vh - 80px);
}
.wrap { max-width: 1600px; margin: 0 auto; }

.view { animation: fade var(--t) ease-out; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.main h1:focus { outline: none; }

/* 강조선(포인트 빨강) */
.accent { width: 32px; height: 4px; border-radius: 2px; background: var(--point); }

/* 홈 큰 제목 */
.hero { padding: 48px 0 64px; }
.hero .accent { margin-bottom: 24px; }
.hero-title {
  font-size: var(--fs-hero); font-weight: 700; letter-spacing: -0.02em; line-height: 1.25;
}
.hero-title span { display: block; }
.hero-title .lead { color: var(--sub); font-size: 0.5em; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 8px; }

/* 보드·페이지 머리 */
.head { text-align: center; padding: 32px 0 48px; }
.head .accent { margin: 0 auto 16px; }
.eyebrow { font-size: var(--fs-aux); font-weight: 600; color: var(--sub); margin-bottom: 8px; }
.board-title { font-size: var(--fs-board); font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }

.count { font-size: var(--fs-aux); color: var(--sub); margin-top: 8px; }
.head.left { text-align: left; }
.head.left .accent { margin-left: 0; }

/* 다음 단계에서 채울 자리 */
.slot {
  min-height: 240px; border-radius: var(--r-card);
  background: var(--mist); color: var(--ink);
  display: grid; place-items: center; text-align: center;
  padding: 24px; font-size: var(--fs-aux);
}

/* 버튼(알약) */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 24px; border-radius: var(--r-pill);
  background: var(--ink); color: var(--bg);
  font-weight: 600; text-decoration: none; border: 0; cursor: pointer; font: inherit;
  transition: opacity var(--t);
}
.btn:hover { opacity: 0.88; }

/* 검색 결과 목록(3단계에서 벽돌형으로 바뀜) */
.empty { text-align: center; color: var(--sub); padding: 64px 0; }

/* ---------- 보드: 필터 칩 ---------- */
.chips-scroll { overflow-x: auto; scrollbar-width: none; margin: -16px 0 40px; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chips { display: flex; gap: 8px; width: max-content; margin: 0 auto; padding: 0 0 8px; }
.chip {

  background: var(--mist); color: var(--ink);

  cursor: pointer; transition: background-color var(--t), color var(--t);
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* ---------- 벽돌형 그리드 (JS가 위치 계산) ---------- */
.masonry { position: relative; }
.card {
  position: absolute; top: 0; left: 0;
  display: block; color: inherit; text-decoration: none;
  border-radius: var(--r-card);
  animation: rise var(--t) ease-out both;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
/* ---------- 제목형 썸네일 카드 (게시물 표지) ----------
   차분한 색 면 + 은은한 도형 하나 + 왼쪽 위 머리글 + 왼쪽 아래 제목.
   container-type 덕분에 cqw 단위가 '카드 폭' 기준이 되어 어느 크기에서도 비율이 같습니다. */
.tcard {
  container-type: inline-size; position: relative; width: 100%;
  overflow: hidden; border-radius: var(--r-card);
  background: var(--tone, var(--mist)); color: var(--ink);
}
.tcard.fill { height: 100%; border-radius: 0; }
.tcard-motif { position: absolute; inset: 0; width: 100%; height: 100%; }
.tcard-eyebrow {
  position: absolute; left: 8cqw; top: 7cqw; right: 8cqw;
  font-size: clamp(11px, 4.4cqw, 15px); font-weight: 600; letter-spacing: -0.01em; line-height: 1.3;
  color: rgba(17, 17, 17, 0.7);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tcard-label {
  position: absolute; left: 8cqw; right: 8cqw; bottom: 7cqw;
  font-weight: 700; letter-spacing: -0.03em; line-height: 1.12;
  white-space: pre-line; word-break: keep-all;
}
@container (max-width: 150px) { .tcard-eyebrow { display: none; } }
.tq-line { border: 1px solid var(--mist); }
.tq-mark { position: absolute; left: 8cqw; top: 13cqw; font-size: 18cqw; font-weight: 700; line-height: 1; color: rgba(17, 17, 17, 0.2); }
.tq-text {
  position: absolute; left: 8cqw; right: 8cqw; top: 30cqw; margin: 0;
  font-size: min(6.8cqw, 28px); font-weight: 600; line-height: 1.45; letter-spacing: -0.02em;
  display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all;
}
.tq-no { position: absolute; left: 8cqw; bottom: 7cqw; font-size: clamp(11px, 4.4cqw, 15px); font-weight: 600; color: rgba(17, 17, 17, 0.6); font-variant-numeric: tabular-nums; }
.tcard-graph { position: absolute; left: 8cqw; right: 8cqw; top: 18cqw; height: 38cqw; }
.tcard-graph svg { display: block; width: 100%; height: 100%; }
.tcard::after {
  content: ''; position: absolute; inset: 0;
  background: rgba(17, 17, 17, 0.08); opacity: 0; transition: opacity var(--t);
}
.lift:hover .tcard::after, .lift:focus-visible .tcard::after { opacity: 1; }
.card-text { padding: 8px 8px 0; }
.card-title, .card-meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.5; }

.res { max-width: 1200px; margin: 0 auto; }

.post-media {
  position: relative; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  min-height: 320px; padding: 48px 32px;
}
.post-art { width: 100%; max-width: 520px; margin: 0 auto; }
.post-info { padding: 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.post-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.post-bar .spacer { flex: 1; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 0;
  display: grid; place-items: center;
  background: transparent; color: var(--ink); cursor: pointer; text-decoration: none;
  transition: background-color var(--t);
}
.icon-btn:hover { background: var(--mist); }
.icon-btn svg { width: 24px; height: 24px; }
.copy-msg { font-size: var(--fs-aux); color: var(--sub); }
.post-board { font-size: var(--fs-aux); font-weight: 600; color: var(--sub); }
.post-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
.post-sub { color: var(--sub); margin-top: -8px; }
.teacher { display: flex; align-items: center; gap: 8px; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--ink); color: var(--bg); font-weight: 600;
}
.teacher-name { font-weight: 600; }
.teacher-meta { color: var(--sub); }
.post-summary { line-height: 1.8; }
.info { margin: 8px 0 0; }
.info-row {
  display: grid; grid-template-columns: 96px 1fr; gap: 16px;
  padding: 16px 0; border-top: 1px solid var(--mist);
}
.info-row:last-child { border-bottom: 1px solid var(--mist); }
.info dt { font-size: var(--fs-aux); font-weight: 600; color: var(--sub); line-height: 1.8; }
.info dd { margin: 0; font-size: 14px; line-height: 1.8; }
.info dd a { text-underline-offset: 4px; }

/* 크게 보기 */
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(17, 17, 17, 0.92);
  display: grid; place-items: center; padding: 64px 32px 32px;
  animation: fade var(--t) ease-out;
}
.lightbox img { max-width: 100%; max-height: calc(100vh - 96px); object-fit: contain; border-radius: var(--r-card); }
.lightbox .close {
  position: absolute; top: 16px; right: 16px;
  height: 40px; padding: 0 24px; border: 0; border-radius: var(--r-pill);
  background: var(--bg); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer;
}

/* ---------- 게시물 상세: 본문 탭 ---------- */
.post-body { max-width: 760px; margin: 48px auto 0; }
.tabs {
  display: flex; gap: 24px; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--mist);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; flex: none;
  height: 48px; padding: 0; border: 0; background: none; cursor: pointer;
  font: inherit; font-size: var(--fs-body); font-weight: 400; color: var(--sub);
  transition: color var(--t);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.tab[aria-selected="true"]::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--ink);
}
.panel { padding-top: 16px; }
.panel:focus { outline: none; }

/* ---------- 본문 블록 ---------- */
.blk { margin-top: 24px; }
.blk-heading { font-size: var(--fs-sub); font-weight: 600; line-height: 1.5; margin-top: 48px; }
.panel > .blk:first-child { margin-top: 24px; }
.blk-text { line-height: 1.8; white-space: pre-line; }
.blk-list { margin-top: 16px; padding-left: 24px; line-height: 1.8; }
.blk-list li { white-space: pre-line; }
.blk-list li + li { margin-top: 8px; }
.blk-pairs { margin-top: 16px; }
.pair {
  display: grid; grid-template-columns: 120px 1fr; gap: 16px;
  padding: 16px 0; border-bottom: 1px solid var(--mist);
}
.pair:first-child { border-top: 1px solid var(--mist); }
.pair dt { font-weight: 600; line-height: 1.8; }
.pair dd { margin: 0; line-height: 1.8; white-space: pre-line; }
.blk-stats { display: grid; gap: 16px; }
.stat { border: 1px solid var(--mist); border-radius: var(--r-card); padding: 24px; }
.stat-value { font-size: 36px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.stat-label { font-weight: 600; margin-top: 8px; }
.stat-note { font-size: var(--fs-aux); color: var(--sub); margin-top: 8px; }
.blk-quote { margin: 32px 0 0; }
.quote-mark { font-size: 56px; font-weight: 700; line-height: 1; height: 32px; }
.blk-quote blockquote { margin: 16px 0 0; font-size: 18px; line-height: 1.7; white-space: pre-line; }
.blk-quote figcaption { margin-top: 16px; font-size: var(--fs-aux); color: var(--sub); }
.blk-steps { list-style: none; margin-top: 16px; padding: 0; }
.step { display: grid; grid-template-columns: 48px 1fr; gap: 16px; padding: 16px 0; position: relative; }
.step:not(:last-child)::before {
  content: ''; position: absolute; left: 15px; top: 56px; bottom: -8px;
  width: 1px; background: var(--mist);
}
.step-no { font-size: var(--fs-sub); font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }
.step-title { font-weight: 600; line-height: 1.8; }
.step-text { line-height: 1.8; white-space: pre-line; }
.table-box { overflow-x: auto; border: 1px solid var(--mist); border-radius: var(--r-card); }
.table-box table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table-box th, .table-box td { padding: 16px; text-align: left; vertical-align: top; min-width: 120px; line-height: 1.6; white-space: pre-line; }
.table-box th { background: var(--mist); font-weight: 600; }
.table-box tr + tr td { border-top: 1px solid var(--mist); }
.blk-chart { margin: 24px 0 0; border: 1px solid var(--mist); border-radius: var(--r-card); padding: 24px; }
.chart-title { font-weight: 600; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; font-size: var(--fs-aux); color: var(--sub); }
.chart-legend span { display: inline-flex; align-items: center; gap: 8px; }
.chart-legend i { display: inline-block; width: 16px; height: 8px; border-radius: 2px; }
.chart-canvas { margin-top: 16px; min-height: 240px; }
.chart-canvas svg { width: 100%; height: auto; overflow: visible; }
.chart-foot { margin-top: 8px; font-size: var(--fs-aux); color: var(--sub); }
.blk-prompt { position: relative; background: var(--mist); border-radius: var(--r-card); padding: 24px; }
.prompt-title { font-weight: 600; padding-right: 96px; }
.prompt-meta { font-size: var(--fs-aux); color: var(--sub); margin-top: 8px; }
.prompt-text { margin-top: 16px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
.prompt-review { margin-top: 16px; padding-top: 16px; border-top: 1px solid rgba(17, 17, 17, 0.12); font-size: 14px; line-height: 1.7; }
.prompt-review b { font-weight: 600; }
.copy-btn {
  position: absolute; top: 16px; right: 16px;
  height: 32px; padding: 0 16px; border: 0; border-radius: var(--r-pill);
  background: var(--bg); color: var(--ink);
  font: inherit; font-size: var(--fs-aux); font-weight: 600; cursor: pointer;
}
.blk-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cmp { border: 1px solid var(--mist); border-radius: var(--r-card); padding: 24px; }
.cmp.after { border-color: var(--ink); }
.cmp-label { font-size: var(--fs-aux); font-weight: 600; color: var(--sub); }
.cmp.after .cmp-label { color: var(--ink); }
.cmp-text { margin-top: 8px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
.cmp-note { grid-column: 1 / -1; font-size: var(--fs-aux); color: var(--sub); }
.blk-note { background: var(--mist); border-radius: var(--r-card); padding: 16px 24px; font-size: 14px; line-height: 1.7; white-space: pre-line; }
.blk-image { margin: 24px 0 0; }
.blk-image img { display: block; width: auto; max-width: 100%; height: auto; max-height: 720px; margin: 0 auto; border-radius: var(--r-card); }  /* 원래 크기보다 키우지 않음 */
.img-ph {
  aspect-ratio: 16 / 9; border-radius: var(--r-card); background: var(--mist);
  display: grid; place-items: center; font-size: var(--fs-aux); color: var(--sub);
}
.blk-image figcaption { text-align: center; margin-top: 8px; font-size: var(--fs-aux); color: var(--sub); }
.blk-file {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 0; border-top: 1px solid var(--mist); border-bottom: 1px solid var(--mist);
  color: var(--ink); text-decoration: none; font-weight: 600;
}
.blk-file + .blk-file { margin-top: 0; border-top: 0; }
.blk-file svg { width: 20px; height: 20px; flex: none; }
a.blk-file:hover span { text-decoration: underline; text-decoration-color: var(--point); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.blk-file .later { font-weight: 400; font-size: var(--fs-aux); color: var(--sub); margin-left: auto; }

/* 이 보드의 다른 게시물 */
.more-posts { margin-top: 96px; }
.more-posts h2 { font-size: var(--fs-sub); font-weight: 600; margin-bottom: 24px; }

/* ---------- 홈 ---------- */
.hero-tagline { margin-top: 24px; font-weight: 600; color: var(--sub); }
.hero-goal { margin-top: 8px; font-size: var(--fs-sub); line-height: 1.6; }
.sec { margin-top: 64px; }
.sec-title { font-size: var(--fs-sub); font-weight: 600; margin-bottom: 24px; }
.board-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px 16px; }
.board-card { display: block; color: inherit; text-decoration: none; border-radius: var(--r-card); }
.board-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
.collage {
  position: relative; aspect-ratio: 4 / 3; overflow: hidden;
  border-radius: var(--r-card);
  display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 2px;
  min-height: 0;
}
.collage .cell { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
.collage .cell.big { grid-row: 1 / 3; }
.collage .cell.empty { background: var(--mist); }
.bc-name {
  margin-top: 8px; padding: 0 8px; font-weight: 600; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.bc-count { padding: 0 8px; font-size: var(--fs-aux); color: var(--sub); }

/* ---------- 개요 ---------- */
.ov-sec { margin-top: 64px; }
.ov-no { font-size: var(--fs-aux); font-weight: 600; color: var(--sub); }
.ov-h { font-size: var(--fs-sub); font-weight: 600; margin: 8px 0 24px; }
.ov-goal { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.5; }
.tag {
  display: inline-flex; align-items: center; height: 32px; padding: 0 16px;
  border-radius: var(--r-pill); background: var(--mist); color: var(--ink);
  font-size: var(--fs-aux); font-weight: 600; text-decoration: none; white-space: nowrap;
}
a.tag { transition: background-color var(--t), color var(--t); }
a.tag:hover { background: var(--ink); color: var(--bg); }
.dirs { list-style: none; margin: 0; padding: 0; }
.dir {
  display: grid; grid-template-columns: 48px 1fr auto; column-gap: 16px;
  grid-template-areas: "no tag link" "no title link" "no desc link";
  padding: 32px 0; border-top: 1px solid var(--mist);
}
.dir:last-child { border-bottom: 1px solid var(--mist); }
.dir-no { grid-area: no; font-size: var(--fs-sub); font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; }
.dir .tag-wrap { grid-area: tag; }
.dir-title { grid-area: title; font-size: var(--fs-sub); font-weight: 600; line-height: 1.5; margin-top: 8px; }
.dir-desc { grid-area: desc; margin: 8px 0 0; padding: 0; list-style: none; line-height: 1.8; }
.dir-desc li { position: relative; padding-left: 16px; }
.dir-desc li::before { content: ''; position: absolute; left: 0; top: 13px; width: 4px; height: 4px; border-radius: 50%; background: var(--sub); }
.dir-link { grid-area: link; align-self: start; padding-top: 4px; }
.go {
  font-size: var(--fs-aux); font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap;
}
.go:hover { text-decoration: underline; text-decoration-color: var(--point); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.task-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.task-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 24px; border: 1px solid var(--mist); border-radius: var(--r-card);
  color: inherit; text-decoration: none; transition: border-color var(--t);
}
.task-card:hover { border-color: var(--ink); }
.task-card .tag { align-self: flex-start; }
.tc-name { font-weight: 600; line-height: 1.5; margin-top: 8px; }
.tc-desc { font-size: 14px; line-height: 1.7; color: var(--sub); flex: 1; }
.tc-go { font-size: var(--fs-aux); font-weight: 600; margin-top: 8px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 32px; }
.flow li {
  position: relative; height: 96px; border-radius: var(--r-card); background: var(--mist);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
}
.flow li:last-child { background: var(--ink); color: var(--bg); }
.flow li:last-child .flow-no { color: rgba(255, 255, 255, 0.7); }
.flow-no { font-size: var(--fs-aux); font-weight: 600; color: var(--sub); }
.flow-label { font-size: var(--fs-sub); font-weight: 600; }
.flow li:not(:last-child)::after {
  content: '→'; position: absolute; right: -24px; top: 50%; transform: translateY(-50%);
  width: 16px; text-align: center; color: var(--sub);
}
.flow-note { margin-top: 16px; font-size: var(--fs-aux); color: var(--sub); }
.sched-empty { text-align: center; color: var(--sub); }

@media (max-width: 1279.98px) {
  .board-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* ---------- 휴대폰(768px 미만): 왼쪽 메뉴 → 아래 고정 탭바 ---------- */
@media (max-width: 767.98px) {
  .nav {
    inset: auto 0 0 0; width: auto;
    height: calc(var(--tab-h) + env(safe-area-inset-bottom));
    padding: 0 0 env(safe-area-inset-bottom);
    flex-direction: row;
    border-right: 0; border-top: 1px solid var(--mist);
  }
  .nav > .mark { display: none; }
  .nav ul { flex-direction: row; gap: 0; width: 100%; height: 100%; }
  .nav li { flex: 1; }
  .nav-item { width: 100%; height: 100%; border-radius: 0; gap: 0; }
  .nav-item:hover { background: transparent; }
  .nav-item .label { display: block; font-size: var(--fs-aux); font-weight: 600; line-height: 1.6; }
  .nav-item .bar { position: absolute; top: 0; left: 50%; width: 24px; transform: translateX(-50%); }
  .tip { display: none; }

  .top { margin-left: 0; padding: 16px; }
  .top .mark { display: grid; width: 40px; height: 40px; margin: 0; flex: none; }
  .main { margin-left: 0; padding: 24px 16px calc(var(--tab-h) + 48px + env(safe-area-inset-bottom)); }
  .hero { padding: 24px 0 48px; }
  .board-title { font-size: 32px; }

  .post-card { grid-template-columns: 1fr; }
  .post-media { min-height: 0; padding: 32px 24px 8px; }
  .post-info { padding: 24px; }
  .post-title { font-size: 28px; }
  .pair { grid-template-columns: 96px 1fr; }
  .blk-stats { grid-template-columns: 1fr 1fr !important; }
  .blk-compare { grid-template-columns: 1fr; }
  .lightbox { padding: 64px 16px 16px; }

  .board-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .res .blk-stats { grid-template-columns: 1fr 1fr !important; }
  .sec-tabs { justify-content: flex-start; gap: 24px; }
  .board-intro { margin-top: -24px; }
  .hero-goal { font-size: 18px; }
  .ov-goal { font-size: 24px; }
  .dir {
    grid-template-columns: 40px 1fr;
    grid-template-areas: "no tag" "no title" "no link" "no desc";
  }
  .dir-link { padding-top: 8px; }
  .task-cards { grid-template-columns: 1fr; }
  .flow { grid-template-columns: 1fr; gap: 24px; }
  .flow li { height: 64px; flex-direction: row; gap: 16px; }
  .flow li:not(:last-child)::after { content: '↓'; right: auto; left: 50%; top: auto; bottom: -24px; transform: translateX(-50%); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<body>
<a class="skip" href="#main">본문 바로가기</a>

<nav class="nav" id="nav" aria-label="주 메뉴"></nav>

<header class="top">
  <a class="mark" href="#/" aria-label="홈으로">대원</a>
  <form class="search" id="searchForm" role="search" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
    <label class="sr-only" for="q">사이트 검색</label>
    <input id="q" type="search" placeholder="사례, 교과, 프롬프트 검색" enterkeyhint="search">
  </form>
</header>

<main class="main" id="main"></main>

<script>
/* ====================================================================
   화면 코드 — 교사는 수정하지 않아도 됩니다.
   ==================================================================== */
(function () {
  'use strict';

  /* ---------- 선 아이콘 (1.8px) ---------- */
  const P = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
  const ICONS = {
    home:    '<svg viewBox="0 0 24 24" ' + P + ' aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20H15v-6H9v6H4z"/></svg>',
    doc:     '<svg viewBox="0 0 24 24" ' + P + ' aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
    board:   '<svg viewBox="0 0 24 24" ' + P + ' aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/></svg>',
    book:    '<svg viewBox="0 0 24 24" ' + P + ' aria-hidden="true"><path d="M3 5.5c2.5-1 5.5-1 9 1 3.5-2 6.5-2 9-1V19c-2.5-1-5.5-1-9 1-3.5-2-6.5-2-9-1z"/><path d="M12 6.5V20"/></svg>',
    prompt:  '<svg viewBox="0 0 24 24" ' + P + ' aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"/><path d="m8 9 2 1.5L8 12M12 12h4"/></svg>',
    chart:   '<svg viewBox="0 0 24 24" ' + P + ' aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>'
  };
  const BOARD_ICON = { overview: 'doc', task1: 'board', task2: 'book', task3: 'prompt', results: 'chart' };

  /* ---------- 도구 ---------- */
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const boardById = (id) => DATA.boards.find((b) => b.id === id);
  const POSTS = DATA.posts.filter((p) => !p.hidden); // hidden: true 게시물은 화면에서 제외
  const postById = (id) => POSTS.find((p) => p.id === id);
  const boardHref = (b) => (b.kind === 'board' ? '#/board/' + b.id : '#/' + b.id);
  const fullName = (b) => (b.no ? b.no + '. ' + b.title : b.title);

  /* ---------- 메뉴 그리기 ---------- */
  function buildNav() {
    const items = [{ key: 'home', href: '#/', short: '홈', full: '홈', icon: 'home' }]
      .concat(DATA.boards.map((b) => ({
        key: b.id, href: boardHref(b), short: b.short, full: fullName(b), icon: BOARD_ICON[b.id] || 'doc'
      })));
    $('#nav').innerHTML =
      '<a class="mark" href="#/" aria-label="홈: ' + esc(DATA.site.name) + '">대원' +
        '<span class="tip" aria-hidden="true">' + esc(DATA.site.name) + '</span></a>' +
      '<ul>' + items.map((it) =>
        '<li><a class="nav-item" href="' + it.href + '" data-key="' + it.key + '" aria-label="' + esc(it.full) + '">' +
          ICONS[it.icon] +
          '<span class="label" aria-hidden="true">' + esc(it.short) + '</span>' +
          '<span class="bar" aria-hidden="true"></span>' +
          '<span class="tip" aria-hidden="true">' + esc(it.full) + '</span>' +
        '</a></li>').join('') +
      '</ul>';
  }

  /* ---------- 주소 읽기 ---------- */
  function parseHash() {
    const raw = location.hash.replace(/^#/, '') || '/';
    const qi = raw.indexOf('?');
    const path = qi >= 0 ? raw.slice(0, qi) : raw;
    const params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : '');
    const seg = path.split('/').filter(Boolean).map((s) => { try { return decodeURIComponent(s); } catch (e) { return s; } });

    if (seg.length === 0) return { name: 'home' };
    if (seg.length === 1 && seg[0] === 'overview') return { name: 'overview' };
    if (seg.length === 1 && seg[0] === 'results') return { name: 'results' };
    if (seg.length === 1 && seg[0] === 'search') return { name: 'search', q: (params.get('q') || '').trim() };
    if (seg.length === 2 && seg[0] === 'board') {
      const b = boardById(seg[1]);
      if (b && b.kind === 'board') return { name: 'board', board: b };
    }
    if (seg.length === 2 && seg[0] === 'post') return { name: 'post', id: seg[1], tab: params.get('tab') };
    return null; // 없는 주소
  }

  /* ---------- 화면별 뼈대 ---------- */

      if (!sections.some((s) => s.key === sec)) {
        const withPosts = sections.find((s) => inSecPre(s.key).length);
        sec = withPosts ? withPosts.key : (sections.length ? sections[0].key : null);

      const inSec = (key) => (key ? everything.filter((p) => secOf(p) === key) : everything);
      let all = inSec(sec);
      const filters = (b.filters || []).filter((f) => f && f.key);
      let current = boardFilter[b.id] || 'all';
      if (current !== 'all' && !filters.some((f) => f.key === current)) current = 'all';

      return {
        title: fullName(b),
        active: b.id,
        html:
          '<header class="head"><div class="accent" aria-hidden="true"></div>' +
            '<p class="eyebrow">' + esc(b.no) + '</p>' +
            '<h1 class="board-title" tabindex="-1">' + esc(b.title) + '</h1>' +

          draw(shown);

          const refresh = () => { const list = pick(current); count.textContent = '게시물 ' + list.length + '개'; draw(list); };
          if (group) group.addEventListener('click', (e) => {
            const btn = e.target.closest('.chip');

            const btn = e.target.closest('.sec-tab');
            if (!btn) return;
            sec = btn.dataset.sec; boardSection[b.id] = sec; all = inSec(sec);
            st.querySelectorAll('.sec-tab').forEach((c) => c.setAttribute('aria-pressed', String(c === btn)));

    },
    post(r) {

          '</div>' +
          (ph.caption ? '<figcaption>' + esc(ph.caption) + '</figcaption>' : '') +

      return {
        title: (R.title || b.title),
        active: 'results',
        html:
          '<div class="res">' +
            '<header class="res-hero"><div class="accent" aria-hidden="true"></div>' +
              '<p class="eyebrow">' + esc(b.title) + '</p>' +
              '<h1 class="res-title" tabindex="-1">' + esc(R.title || '1년의 성과') + '</h1>' +
              '<p class="res-basis">기준일: ' + esc(R.basis || '[기준일]') + '</p>' +
            '</header>' +
            sec(0, '핵심 숫자', stats) +

            sec(2, '과제별 성과', tasks) +
            (photos.length ? sec(3, '행사·연수 사진', '<div class="photo-grid"></div>') : '') +
            '<p class="blk-note res-source" role="note">' + esc(R.source || '수치 출처: 2026 AI 디지털 활용 선도학교 결과보고서([제출일])') + '</p>' +

    search(r) {

      else if (!found.length) body = '<p class="empty">‘' + esc(q) + '’에 맞는 게시물이 없습니다.</p>';
      else body = '<div class="search-grid"></div>';

        active: null,
        html:
          '<header class="head"><p class="eyebrow">검색 결과</p>' +
            '<h1 class="board-title" tabindex="-1">' + (q ? '‘' + esc(q) + '’' : '검색') + '</h1>' +
            (q ? '<p class="count">게시물 ' + found.length + '개</p>' : '') +

  /* ====================================================================
     벽돌형 그리드
     · 카드는 게시물 순서대로 DOM에 놓이고(키보드 Tab 순서 = 읽는 순서),
       JS가 각 카드를 "가장 짧은 열"에 배치해 위치를 계산합니다.
     ==================================================================== */
  const boardFilter = {};          // 보드별 선택된 필터 기억(상세에서 돌아와도 유지)
  const boardSection = {};         // 보드별 선택된 구역 기억
  let observers = [];              // 화면이 바뀌면 정리

  function colsFor(w) {
    if (w >= 1600) return 6;
    if (w >= 1280) return 5;
    if (w >= 1024) return 4;
    if (w >= 768) return 3;
    return 2;
  }

  function parseRatio(r) {
    const m = String(r || '').match(/^\s*(\d+(?:\.\d+)?)\s*[\/:]\s*(\d+(?:\.\d+)?)\s*$/);
    return m && +m[1] > 0 && +m[2] > 0 ? m[1] + ' / ' + m[2] : '4 / 5';
  }

  const usableSrc = (src) => !!src && typeof src === 'string' && src.indexOf('[') < 0;
  const isWebLink = (u) => typeof u === 'string' && /^https:\/\/[^\s"'<>]+$/.test(u);

  /* ---------- 제목형 썸네일 카드: 모든 표지를 이 함수 하나로 그림 ----------
     cover: { label, tone, ratio } · ctx: { subject, board, seed, eyebrow } · opts.fill: 칸을 꽉 채움(홈 콜라주) */
  const TONE_MAP = (typeof TONES === 'object' && TONES) ? TONES : {};
  const RATIOS = { '1/1': '1 / 1', '4/5': '4 / 5', '3/4': '3 / 4', '2/3': '2 / 3', '5/4': '5 / 4' };

  function toneOf(cover, subject, board) {
    if (board === 'task2') return TONE_MAP['데이터'] || '#F5F4F0';       // 과제 2는 같은 색으로 통일
    return TONE_MAP[cover.tone] || TONE_MAP[subject] || TONE_MAP['공통'] || '#ECEAE5';
  }

  function labelSize(label) {
    const lines = String(label).split('\n').map((l) => l.replace(/\s/g, ''));
    const n = Math.max.apply(null, lines.map((l) => Array.from(l).length).concat(1));
    const one = n <= 2 ? 22 : n === 3 ? 18 : n === 4 ? 15 : n <= 6 ? 12 : 10;
    return lines.length > 1 ? one * 0.9 : one;
  }

  /* 은은한 도형: 과제 2는 막대그래프, 과제 3은 큰 따옴표, 나머지는 게시물마다 도형 4종 중 하나 */
  function motif(board, seed) {
    const K = 'rgba(17,17,17,0.06)', W = 'rgba(255,255,255,0.5)', L = 'rgba(17,17,17,0.14)';
    if (board === 'task2') {
      const hs = [12, 20, 15, 28, 22];
      return hs.map((h, i) => '<rect x="' + (56 + i * 7) + '" y="' + (44 - h) + '" width="4" height="' + h + '" rx="1" fill="' + L + '"/>').join('') +
        '<rect x="54" y="44.6" width="38" height="0.6" fill="' + L + '"/>';
    }
    if (board === 'task3') {
      return '<circle cx="82" cy="18" r="30" fill="' + W + '"/>' +
        '<text x="88" y="54" text-anchor="end" font-size="52" font-weight="700" fill="' + K + '" style="font-family:var(--font)">\u201D</text>';
    }
    let h = 0; String(seed || '').split('').forEach((ch) => { h = (h * 31 + ch.charCodeAt(0)) >>> 0; });
    switch (h % 4) {
      case 0: return '<circle cx="80" cy="22" r="32" fill="' + K + '"/><circle cx="80" cy="22" r="14" fill="' + W + '"/>';
      case 1: return '<path d="M58 100V60a21 21 0 0 1 42 0v40z" fill="' + K + '"/><circle cx="22" cy="24" r="6" fill="' + W + '"/>';
      case 2: return '<circle cx="50" cy="-6" r="44" fill="' + W + '"/><circle cx="86" cy="58" r="10" fill="' + K + '"/>';
      default: return '<circle cx="74" cy="30" r="22" fill="none" stroke="' + L + '" stroke-width="0.6"/>' +
                      '<circle cx="74" cy="30" r="32" fill="none" stroke="' + L + '" stroke-width="0.6"/><circle cx="74" cy="30" r="6" fill="' + K + '"/>';
    }
  }

  function coverCard(cover, ctx, opts) {
    const c = cover && typeof cover === 'object' ? cover : {};
    const x = ctx || {};
    const label = String(c.label || x.subject || '').slice(0, 16) || ' ';
    const ratio = RATIOS[String(c.ratio || '').replace(/\s/g, '')] || '1 / 1';
    const fill = opts && opts.fill;
    const graph = typeof c.svg === 'string' && /^\s*<svg[\s>]/i.test(c.svg) && !/<script|\son\w+=/i.test(c.svg) ? c.svg : '';
    const size = labelSize(label) * (graph ? 0.7 : 1);   // 그래프가 있으면 제목을 조금 작게
    if (typeof c.quote === 'string' && c.quote) {        // 흑백 타이포그래피 카드(프롬프트 첫 줄)
      const lines = { '1 / 1': 5, '4 / 5': 6, '3 / 4': 7, '2 / 3': 8, '5 / 4': 4 }[ratio] || 5;
      return '<div class="tcard tq' + (c.bg === 'bg' ? ' tq-line' : '') + (fill ? ' fill' : '') + '" aria-hidden="true" style="--tone:' +
          (c.bg === 'bg' ? 'var(--bg)' : 'var(--mist)') + (fill ? '' : ';aspect-ratio:' + ratio) + '">' +
        (x.eyebrow ? '<span class="tcard-eyebrow">' + esc(x.eyebrow) + '</span>' : '') +
        '<span class="tq-mark">\u201C</span>' +
        '<p class="tq-text" style="-webkit-line-clamp:' + (fill ? 4 : lines) + '">' + esc(c.quote) + '</p>' +
        (c.no ? '<span class="tq-no">' + esc(c.no) + '</span>' : '') +
      '</div>';
    }
    return '<div class="tcard' + (fill ? ' fill' : '') + '" aria-hidden="true" style="--tone:' + toneOf(c, x.subject, x.board) +
        (fill ? '' : ';aspect-ratio:' + ratio) + '">' +
      (graph
        ? '<div class="tcard-graph">' + graph + '</div>'
        : '<svg class="tcard-motif" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">' + motif(x.board, x.seed) + '</svg>') +
      (x.eyebrow ? '<span class="tcard-eyebrow">' + esc(x.eyebrow) + '</span>' : '') +
      '<span class="tcard-label" style="font-size:min(' + size.toFixed(1) + 'cqw, ' + Math.round(size * 4) + 'px)">' + esc(label) + '</span>' +
    '</div>';
  }

  /* 게시물 표지: 머리글은 '과제 1 · 음악'처럼 보드 번호와 교과 */
  function postCover(p, opts) {
    const b = boardById(p.board) || {};
    return coverCard(p.cover, {
      subject: p.subject, board: p.board, seed: p.id,
      eyebrow: (p.cover && p.cover.eyebrow) || [b.no, p.subject].filter((v) => v && String(v).indexOf('[') < 0).join(' · ')
    }, opts);

  function cardHTML(p) {
    const meta = [p.author, p.subject].filter(Boolean).join(' · ');
    return '<a class="card lift" href="#/post/' + encodeURIComponent(p.id) + '" aria-label="' + esc(p.title) + '">' +

        '<p class="card-title">' + esc(p.title) + '</p>' +

  /* 이미지: 불러오면 보이고, 파일이 없으면 지워서 회색 자리만 남김 */
  function watchImages(root) {
    root.querySelectorAll('.thumb img, .collage img, .photo-box img').forEach((img) => {
      const ok = () => img.classList.add('loaded');
      const fail = () => img.remove();
      if (img.complete && img.naturalWidth > 0) ok();
      img.addEventListener('load', ok);
      img.addEventListener('error', fail);
    });
  }

  function layoutMasonry(grid) {
    const cards = Array.prototype.slice.call(grid.children);
    const W = grid.clientWidth;
    if (!W) return;
    const n = colsFor(window.innerWidth);
    const gap = 16, rowGap = 24;
    const cw = (W - gap * (n - 1)) / n;
    cards.forEach((c) => { c.style.width = cw + 'px'; });        // 폭 먼저 모두 정하고
    const hs = cards.map((c) => c.offsetHeight);                 // 높이를 한 번에 읽기
    const cols = new Array(n).fill(0);
    cards.forEach((c, i) => {
      let k = 0;
      for (let j = 1; j < n; j++) if (cols[j] < cols[k] - 0.5) k = j;  // 가장 짧은 열(같으면 왼쪽)
      c.style.left = (k * (cw + gap)) + 'px';
      c.style.top = cols[k] + 'px';
      cols[k] += hs[i] + rowGap;
    });
    grid.style.height = Math.max(0, Math.max.apply(null, cols) - rowGap) + 'px';
  }

  function mountMasonry(box, list, toHTML) {
    box.innerHTML = '<div class="masonry">' + list.map(toHTML || cardHTML).join('') + '</div>';
    const grid = box.firstChild;
    watchImages(grid);
    layoutMasonry(grid);
    let lastW = grid.clientWidth;
    if ('ResizeObserver' in window) {
      const ro = new ResizeObserver(() => {
        if (grid.clientWidth !== lastW) { lastW = grid.clientWidth; layoutMasonry(grid); }
      });
      ro.observe(grid);
      observers.push(ro);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (grid.isConnected) layoutMasonry(grid); });
  }

  window.addEventListener('resize', () => {
    document.querySelectorAll('.masonry').forEach(layoutMasonry);
  });
  /* ====================================================================
     게시물 상세 + 본문 블록 표시기
     ==================================================================== */
  const SV = 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
  const UI = {
    back:   '<svg viewBox="0 0 24 24" ' + SV + '><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
    link:   '<svg viewBox="0 0 24 24" ' + SV + '><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>',
    check:  '<svg viewBox="0 0 24 24" ' + SV + '><path d="m5 12 5 5 9-10"/></svg>',
    expand: '<svg viewBox="0 0 24 24" ' + SV + '><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    down:   '<svg viewBox="0 0 24 24" ' + SV + '><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>'
  };
  const GRAY = 'rgba(17,17,17,0.35)';   // 그래프 보조 계열 = --ink 35%
  const SERIES_COLORS = ['var(--ink)', GRAY, 'rgba(17,17,17,0.6)'];

  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) { /* 아래 방식으로 재시도 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }

  function openLightbox(src, alt, opener) {
    const box = document.createElement('div');
    box.className = 'lightbox';
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', '크게 보기');
    box.innerHTML = '<button type="button" class="close">닫기</button><img src="' + esc(src) + '" alt="' + esc(alt) + '">';
    document.body.appendChild(box);
    document.body.style.overflow = 'hidden';
    const closeBtn = box.querySelector('.close');
    const close = () => {
      document.removeEventListener('keydown', onKey, true);
      window.removeEventListener('hashchange', close);
      box.remove(); document.body.style.overflow = '';
      if (opener && opener.isConnected) opener.focus();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Tab') { e.preventDefault(); closeBtn.focus(); }
    };
    closeBtn.addEventListener('click', close);
    box.addEventListener('click', (e) => { if (e.target === box) close(); });
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('hashchange', close);
    closeBtn.focus();
  }

  /* ---------- 블록 → HTML ---------- */
  let ctx = { charts: [], copies: [] };
  const arr = (v) => (Array.isArray(v) ? v : []);

  function renderBlocks(blocks) {
    ctx = { charts: [], copies: [] };
    return arr(blocks).map((b) => {
      try { return renderBlock(b || {}); } catch (e) { return ''; }

  function renderBlock(b) {
    switch (b.type) {
      case 'heading':

      case 'text':

      case 'pairs':

          '<div class="pair"><dt>' + esc(it && it.k) + '</dt><dd>' + esc(it && it.v) + '</dd></div>').join('') + '</dl>';
      case 'stats': {

        return '<div class="blk blk-stats" style="grid-template-columns:repeat(' + cols + ',1fr)">' + items.map((it) =>

      case 'steps':

      case 'table':

          '<thead><tr>' + arr(b.columns).map((c) => '<th scope="col">' + esc(c) + '</th>').join('') + '</tr></thead>' +
          '<tbody>' + arr(b.rows).map((r) => '<tr>' + arr(r).map((c) => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody>' +
          '</table></div>';
      case 'chart': {
        const id = ctx.charts.push(b) - 1;
        const series = arr(b.series);
        const legend = series.length > 1
          ? '<div class="chart-legend" aria-hidden="true">' + series.map((s, i) =>
              '<span><i style="background:' + SERIES_COLORS[Math.min(i, 2)] + '"></i>' + esc(s.name) + '</span>').join('') + '</div>'
          : '';
        const foot = [b.unit ? '단위: ' + b.unit : '', b.note || ''].filter(Boolean).join(' · ');
        return '<figure class="blk blk-chart">' +
          (b.title ? '<p class="chart-title">' + esc(b.title) + '</p>' : '') + legend +
          '<div class="chart-canvas" data-chart="' + id + '"></div>' +
          (foot ? '<figcaption class="chart-foot">' + esc(foot) + '</figcaption>' : '') + '</figure>';
      }
      case 'prompt': {
        const id = ctx.copies.push(String(b.text || '')) - 1;
        const meta = [b.tool ? '도구: ' + b.tool : '', b.purpose ? '목적: ' + b.purpose : ''].filter(Boolean).join(' · ');
        return '<div class="blk blk-prompt">' +
          '<p class="prompt-title">' + esc(b.title || '프롬프트') + '</p>' +

          '<button type="button" class="copy-btn" data-copy="' + id + '" aria-label="프롬프트 원문 복사">복사</button>' +
          '<p class="prompt-text">' + esc(b.text) + '</p>' +
          (b.review ? '<p class="prompt-review"><b>자체 평가</b> ' + esc(b.review) + '</p>' : '') + '</div>';
      }
      case 'compare':
        return '<div class="blk blk-compare">' +
          '<div class="cmp before"><p class="cmp-label">수정 전</p><p class="cmp-text">' + esc(b.before) + '</p></div>' +
          '<div class="cmp after"><p class="cmp-label">수정 후</p><p class="cmp-text">' + esc(b.after) + '</p></div>' +
          (b.note ? '<p class="cmp-note">' + esc(b.note) + '</p>' : '') + '</div>';
      case 'image':
        return '<figure class="blk blk-image">' +
          (usableSrc(b.src)
            ? '<img src="' + esc(b.src) + '" alt="' + esc(b.alt || b.caption || '') + '" loading="lazy" decoding="async">'
            : '<div class="img-ph">이미지 준비 중</div>') +

          : '';

        return usableSrc(b.href)
          ? '<a class="blk blk-file" href="' + esc(b.href) + '" download>' + UI.down + '<span>' + esc(b.label || '파일') + '</span></a>'
          : '<div class="blk blk-file">' + UI.down + '<span>' + esc(b.label || '파일') + '</span><span class="later">준비 중</span></div>';
      default:

  }

  /* ---------- 그래프 (SVG 직접 그리기) ---------- */
  function drawChart(el, b) {
    const W = Math.max(240, el.clientWidth);
    const H = W < 480 ? 200 : 240;
    const labels = arr(b.labels).map(String);
    const series = arr(b.series).filter((s) => s && Array.isArray(s.values));
    const unit = b.unit || '';
    const num = (v) => (typeof v === 'number' && isFinite(v) ? v : null);
    const fmt = (v) => v.toLocaleString('ko-KR');
    const vals = [];
    series.forEach((s) => s.values.forEach((v) => { if (num(v) !== null) vals.push(v); }));

    const aria = (b.title || '그래프') + ': ' + labels.map((l, i) => l + ' ' + series.map((s) => {
      const v = num(s.values[i]);
      return (series.length > 1 ? s.name + ' ' : '') + (v === null ? '값 없음' : fmt(v) + unit);
    }).join(', ')).join('; ');

    if (!labels.length || !vals.length) {
      el.innerHTML = '<div class="img-ph" role="img" aria-label="' + esc((b.title || '그래프') + ': 수치가 아직 없습니다') +
        '" style="aspect-ratio:auto;min-height:' + H + 'px">수치가 아직 없습니다</div>';
      return;
    }

    const longLabel = labels.some((l) => l.length > Math.max(2, Math.floor((W - 16) / labels.length / 13)));
    const top = 32, bottom = 40 + (Math.min.apply(null, vals) < 0 ? 16 : 0) + (longLabel ? 16 : 0), left = 8, right = 8;
    const iw = W - left - right, ih = H - top - bottom;
    let lo = Math.min(0, Math.min.apply(null, vals)), hi = Math.max(0, Math.max.apply(null, vals));
    if (hi === lo) hi = lo + 1;
    const y = (v) => top + (hi - v) / (hi - lo) * ih;
    const n = labels.length, gw = iw / n, ns = series.length;
    const T = (x, yy, t, extra) => '<text x="' + x.toFixed(1) + '" y="' + yy.toFixed(1) + '" text-anchor="middle" ' + (extra || '') + '>' + esc(t) + '</text>';
    let out = '';

    out += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y(0).toFixed(1) + '" y2="' + y(0).toFixed(1) + '" style="stroke:var(--mist)" stroke-width="1"/>';

    if (b.chart === 'line') {
      series.forEach((s, si) => {
        const col = SERIES_COLORS[Math.min(si, 2)];
        let d = '', pen = false;
        labels.forEach((_, i) => {
          const v = num(s.values[i]);
          if (v === null) { pen = false; return; }
          const x = left + gw * (i + 0.5);
          d += (pen ? 'L' : 'M') + x.toFixed(1) + ' ' + y(v).toFixed(1);
          pen = true;
        });
        out += '<path d="' + d + '" fill="none" style="stroke:' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
        labels.forEach((_, i) => {
          const v = num(s.values[i]);
          if (v === null) return;
          const x = left + gw * (i + 0.5);
          out += '<circle cx="' + x.toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="4" style="fill:var(--bg);stroke:' + col + '" stroke-width="2"/>';
          out += T(x, y(v) - 12, fmt(v), 'font-size="13" font-weight="600" style="fill:var(--ink)"');
        });
      });
    } else {
      const bw = Math.max(4, Math.min(40, (gw * 0.7 - 4 * (ns - 1)) / ns));
      labels.forEach((_, i) => {
        const x0 = left + i * gw + (gw - (bw * ns + 4 * (ns - 1))) / 2;
        series.forEach((s, si) => {
          const v = num(s.values[i]);
          if (v === null) return;
          const x = x0 + si * (bw + 4);
          const y1 = Math.min(y(v), y(0)), h = Math.max(1, Math.abs(y(v) - y(0)));
          out += '<rect x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="4" style="fill:' + SERIES_COLORS[Math.min(si, 2)] + '"/>';
          out += T(x + bw / 2, v >= 0 ? y1 - 8 : y1 + h + 16, fmt(v), 'font-size="13" font-weight="600" style="fill:var(--ink)"');
        });
      });
    }

    const maxCh = Math.max(2, Math.floor(gw / 13));
    const cut = (t) => (t.length > maxCh ? t.slice(0, maxCh - 1) + '…' : t);
    labels.forEach((l, i) => {
      let lines = [l];
      if (l.length > maxCh) {                       // 긴 이름은 가운데에 가까운 띄어쓰기에서 두 줄로
        const sp = [...l.matchAll(/\s/g)].map((m) => m.index);
        if (sp.length) {
          const k = sp.reduce((a, b) => (Math.abs(b - l.length / 2) < Math.abs(a - l.length / 2) ? b : a));
          lines = [l.slice(0, k), l.slice(k + 1)];
        }
      }
      lines = lines.map(cut);
      const x = left + gw * (i + 0.5);
      const y0 = H - 12 - (lines.length - 1) * 16;
      out += '<g>' + (lines.join(' ') !== l ? '<title>' + esc(l) + '</title>' : '') +
        lines.map((t, j) => T(x, y0 + j * 16, t, 'font-size="13" style="fill:var(--sub)"')).join('') + '</g>';
    });

    el.innerHTML = '<svg role="img" aria-label="' + esc(aria) + '" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H +
      '" style="font-family:var(--font)">' + out + '</svg>';
  }

  /* ---------- 상세 화면 ---------- */

            (p.subtitle ? '<p class="post-sub">' + esc(p.subtitle) + '</p>' : '') +
            (p.author ? '<div class="teacher"><span class="avatar" aria-hidden="true">' + esc(initial) + '</span>' +
              '<p><span class="teacher-name">' + esc(p.author) + '</span>' +
              (meta.length ? '<span class="teacher-meta"> · ' + esc(meta.join(' · ')) + '</span>' : '') + '</p></div>' : '') +
            (p.summary ? '<p class="post-summary">' + esc(p.summary) + '</p>' : '') +
            ((p.period || tags.length || files.length > 1 || links.length)
              ? '<dl class="info">' +
                  (p.period ? row('운영 기간', esc(p.period)) : '') +          // 값이 없는 줄은 숨김
                  (tags.length ? row('활용 도구', esc(tags.join(' · '))) : '') +
                  (files.length > 1 ? row('첨부 파일', fileLinks) : '') +
                  (links.length ? row('관련 링크', links.map((l) => '<a href="' + esc(l.href) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + '</a>').join('<br>')) : '') +
                '</dl>'
              : '') +
          '</div>' +
        '</section>' +
        (tabs.length
          ? '<section class="post-body">' +
              '<div class="tabs" role="tablist" aria-label="본문">' + tabs.map((t, i) =>
                '<button type="button" class="tab" role="tab" id="tab-' + i + '" aria-controls="panel" ' +
                  'aria-selected="' + (i === ti) + '" tabindex="' + (i === ti ? 0 : -1) + '">' + esc(t.name) + '</button>').join('') +
              '</div>' +
              '<div class="panel" id="panel" role="tabpanel" tabindex="0" aria-labelledby="tab-' + ti + '"></div>' +
            '</section>'
          : '') +
        (others.length
          ? '<section class="more-posts" aria-labelledby="more-h"><h2 id="more-h">이 보드의 다른 게시물</h2><div class="others-grid"></div></section>'
          : '') +
      '</article>';

    function mount(main) {

      /* 링크 복사 */
      const copyBtn = $('#copyLink', main), msg = $('.copy-msg', main);
      let t1 = null;
      copyBtn.addEventListener('click', async () => {
        const ok = await copyText(location.href);
        msg.textContent = ok ? '링크를 복사했습니다' : '복사하지 못했습니다';
        if (ok) copyBtn.innerHTML = UI.check;
        clearTimeout(t1);
        t1 = setTimeout(() => { msg.textContent = ''; copyBtn.innerHTML = UI.link; }, 1500);
      });

      /* 본문 탭 */
      const panel = $('#panel', main);
      if (panel) {
        const tabBtns = main.querySelectorAll('.tab');
        let chartObs = null;
        const show = (i, focusTab) => {
          tabBtns.forEach((btn, k) => {
            btn.setAttribute('aria-selected', String(k === i));
            btn.tabIndex = k === i ? 0 : -1;
          });
          if (focusTab) tabBtns[i].focus();
          panel.setAttribute('aria-labelledby', 'tab-' + i);
          panel.innerHTML = renderBlocks(tabs[i].blocks);
          const charts = ctx.charts, copies = ctx.copies;

          panel.querySelectorAll('.chart-canvas').forEach((el) => drawChart(el, charts[+el.dataset.chart]));
          if (chartObs) chartObs.disconnect();
          if ('ResizeObserver' in window && charts.length) {
            let lastW = panel.clientWidth;
            chartObs = new ResizeObserver(() => {
              if (panel.clientWidth === lastW) return;
              lastW = panel.clientWidth;
              panel.querySelectorAll('.chart-canvas').forEach((el) => drawChart(el, charts[+el.dataset.chart]));
            });
            chartObs.observe(panel);
            observers.push(chartObs);
          }

          panel.querySelectorAll('.copy-btn').forEach((btn) => {
            let t2 = null;
            btn.addEventListener('click', async () => {
              const ok = await copyText(copies[+btn.dataset.copy]);
              btn.textContent = ok ? '복사됨' : '복사 실패';
              clearTimeout(t2);
              t2 = setTimeout(() => { btn.textContent = '복사'; }, 1500);
            });
          });

          panel.querySelectorAll('.blk-image img').forEach((im) => {
            im.addEventListener('error', () => {
              const ph = document.createElement('div');
              ph.className = 'img-ph'; ph.textContent = '이미지 준비 중';
              im.replaceWith(ph);
            });
          });

          /* 주소에 탭 번호 남기기(1번 탭은 생략) — 새로고침해도 유지 */
          const h = '#/post/' + encodeURIComponent(p.id) + (i > 0 ? '?tab=' + (i + 1) : '');
          if (location.hash !== h) { try { history.replaceState(history.state, '', h); } catch (e) { /* 주소만 못 바꿈 */ } }
        };
        main.querySelector('.tabs').addEventListener('click', (e) => {
          const btn = e.target.closest('.tab');
          if (btn) show(Array.prototype.indexOf.call(tabBtns, btn), false);
        });
        main.querySelector('.tabs').addEventListener('keydown', (e) => {
          const cur = Array.prototype.findIndex.call(tabBtns, (x) => x.getAttribute('aria-selected') === 'true');
          let next = null;
          if (e.key === 'ArrowRight') next = (cur + 1) % tabBtns.length;
          else if (e.key === 'ArrowLeft') next = (cur - 1 + tabBtns.length) % tabBtns.length;
          else if (e.key === 'Home') next = 0;
          else if (e.key === 'End') next = tabBtns.length - 1;
          if (next !== null) { e.preventDefault(); show(next, true); }
        });
        show(ti, false);
      }

      /* 이 보드의 다른 게시물 */
      const box = $('.others-grid', main);
      if (box) mountMasonry(box, others);
    }

    return { title: p.title, active: p.board, html: html, mount: mount };
  }

  /* ---------- 최신순 정렬: date('YYYY-MM-DD')가 늦은 것부터, 날짜가 없으면 DATA 순서대로 뒤에 ---------- */
  function sortRecent(list) {
    const ok = (d) => (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) ? d : '');
    return list.map((p, i) => ({ p: p, i: i })).sort((a, b) => {
      if (!!a.p.pin !== !!b.p.pin) return a.p.pin ? -1 : 1;   // pin: true 인 게시물(우수 사례)을 맨 앞에
      const da = ok(a.p.date), db = ok(b.p.date);
      if (da !== db) return da < db ? 1 : -1;
      return a.i - b.i;
    }).map((x) => x.p);
  }

  /* ---------- 검색: 제목 · 교사 · 교과 · 태그 ---------- */
  function searchPosts(q) {
    const words = q.toLowerCase().split(/\s+/).filter(Boolean);
    return POSTS.filter((p) => {
      const hay = [p.title, p.subtitle, p.author, p.subject].concat(p.tags || []).join(' ').toLowerCase();
      return words.every((w) => hay.indexOf(w) >= 0);
    });
  }

  /* ---------- 화면 바꾸기 ---------- */
  const input = $('#q');
  let lastName = null;

  function render() {
    const r = parseHash();
    if (!r) { location.replace('#/'); return; } // 없는 주소는 홈으로

    const v = VIEWS[r.name](r);
    const main = $('#main');
    observers.forEach((o) => o.disconnect()); observers = [];
    main.innerHTML = '<div class="wrap view">' + v.html + '</div>';
    if (v.mount) v.mount(main);

    document.title = r.name === 'home' ? DATA.site.name : v.title + ' | ' + DATA.site.name;

    document.querySelectorAll('.nav-item').forEach((a) => {
      if (a.dataset.key === v.active) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });

    const typing = document.activeElement === input;
    if (r.name === 'search') { if (!typing) input.value = r.q; }
    else if (!typing) input.value = '';

    if (!(typing && lastName === 'search' && r.name === 'search')) window.scrollTo(0, 0);
    if (!typing) { const h = $('h1', main); if (h) h.focus({ preventScroll: true }); }
    lastName = r.name;
  }

  /* 검색창: 입력하면 0.25초 뒤 결과 화면으로 */
  let timer = null;
  function goSearch(immediate) {
    clearTimeout(timer);
    const run = () => {
      const q = input.value.trim();
      const target = '#/search' + (q ? '?q=' + encodeURIComponent(q) : '');
      const onSearch = (parseHash() || {}).name === 'search';
      if (!q && !onSearch) return;
      if (location.hash === target) return;
      if (onSearch) location.replace(target); // 타이핑 중에는 방문 기록을 쌓지 않음
      else location.hash = target;
    };
    immediate ? run() : (timer = setTimeout(run, 250));
  }
  input.addEventListener('input', () => goSearch(false));
  $('#searchForm').addEventListener('submit', (e) => { e.preventDefault(); goSearch(true); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Escape') { input.value = ''; goSearch(true); } });

  /* 본문 바로가기: 본문 제목으로 초점 이동 */
  $('.skip').addEventListener('click', (e) => {
    e.preventDefault();
    const h = $('#main h1'); if (h) h.focus();
  });

  buildNav();
  window.addEventListener('hashchange', render);
  if (!location.hash) location.replace('#/');
  render();
})();
</script>
</body>
</html>
