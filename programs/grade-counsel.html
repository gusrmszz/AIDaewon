<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>내신-모의고사 성적 분석 상담기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: 좌측 고정 열(파일 불러오기·학생 검색) + 우측 학생 화면(탭 4개). 좁은 화면에서는 한 열로 쌓임. */
:root{ /* 배포 화면 가독성을 위해 다크 배경으로 고정 */
  --bg:#0f141a; --surface:#171d25; --surface-2:#1f2731; --ink:#e8edf3; --ink-2:#aab4c1; --ink-3:#808b99;
  --line:#2c3541; --accent:#86b6ef; --accent-soft:#1b2a3f;
  --good:#5cc98a; --good-soft:#132f20; --bad:#f08a80; --bad-soft:#3a1a17; --warn:#e3a948; --warn-soft:#382810;
  --hi:#7fb0ff; --hi-soft:#16284a; --t1-bg:#18263a; --t2-bg:#33291a; --up:#ff7b72; --up-soft:#3b1a1a; --down:#6cb6ff; --down-soft:#15263d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --r:10px;
  color-scheme:dark }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141a; --surface:#171d25; --surface-2:#1f2731; --ink:#e8edf3; --ink-2:#aab4c1; --ink-3:#808b99;
  --line:#2c3541; --accent:#86b6ef; --accent-soft:#1b2a3f;
  --good:#5cc98a; --good-soft:#132f20; --bad:#f08a80; --bad-soft:#3a1a17; --warn:#e3a948; --warn-soft:#382810;
  --hi:#7fb0ff; --hi-soft:#16284a; --t1-bg:#18263a; --t2-bg:#33291a; --up:#ff7b72; --up-soft:#3b1a1a; --down:#6cb6ff; --down-soft:#15263d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f141a; --surface:#171d25; --surface-2:#1f2731; --ink:#e8edf3; --ink-2:#aab4c1; --ink-3:#808b99;
  --line:#2c3541; --accent:#86b6ef; --accent-soft:#1b2a3f;
  --good:#5cc98a; --good-soft:#132f20; --bad:#f08a80; --bad-soft:#3a1a17; --warn:#e3a948; --warn-soft:#382810;
  --hi:#7fb0ff; --hi-soft:#16284a; --t1-bg:#18263a; --t2-bg:#33291a; --up:#ff7b72; --up-soft:#3b1a1a; --down:#6cb6ff; --down-soft:#15263d;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;border-bottom:1px solid var(--line);padding-block:4px 12px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand-name{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand-sub{color:var(--ink-3);font-size:15px}
.src{font-size:14.5px;color:var(--ink-2)}
.src b{color:var(--ink)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.side{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lbl{font-size:14px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px 12px;text-align:left;background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{font-size:16px}
.drop span{font-size:14px;color:var(--ink-3)}
.privacy{font-size:13.5px;color:var(--ink-3);margin:0}
.report{font-size:14.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:6px}
.report ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:2px}
.report details summary{cursor:pointer;color:var(--ink)}
.err{color:var(--bad);font-size:15px}
.sample-flag{display:inline-block;font-size:13px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
#q{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:52vh;overflow:auto}
.results button{width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;cursor:pointer;display:flex;flex-direction:column}
.results button:hover{background:var(--surface-2)}
.results button[aria-current="true"]{background:var(--accent-soft)}
.results .nm{font-weight:600}
.results .meta{font-size:14px;color:var(--ink-3)}
.hint{font-size:14.5px;color:var(--ink-3);margin:0}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.stu{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.stu h1{font-family:var(--f-display);font-weight:800;font-size:30px;margin:0;line-height:1.2;text-wrap:balance}
.stu .where{color:var(--ink-2);font-size:16px}
.stu .hist{color:var(--ink-3);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.up{background:var(--up-soft);color:var(--up)}
.chip.down{background:var(--down-soft);color:var(--down)}
b.dir{font-weight:700}
b.mk-ok{color:var(--good);font-weight:800}
b.mk-no{color:var(--bad);font-weight:800}
b.dir.up{color:var(--up)}
b.dir.down{color:var(--down)}
b.dir.same{color:var(--ink-2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:17px;margin:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .no{color:var(--accent);font-weight:700}
.card h2 small{font-weight:400;color:var(--ink-3);font-size:14px}
.card h3{font-size:15px;margin:0;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:14px;color:var(--ink-2)}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .s{font-size:13.5px;color:var(--ink-3)}
.note{font-size:14.5px;color:var(--ink-3);margin:0}
.msg{font-size:15px;background:var(--surface-2);border-radius:8px;padding:10px 12px;color:var(--ink-2);margin:0}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:14px;background:var(--surface-2)}
th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
td.cell{cursor:pointer}
td.cell:hover{background:var(--surface-2)}
td.cell.sel{background:var(--accent-soft);font-weight:700}
td.muted,span.muted{color:var(--ink-3)}
.strip{display:flex;flex-direction:column;gap:2px}
.strip-row{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;align-items:center;gap:10px;padding:6px 6px;border-radius:7px;border:0;background:none;text-align:left;cursor:pointer;width:100%}
.strip-row:hover{background:var(--surface-2)}
.strip-row.sel{background:var(--accent-soft)}
.strip-row .nm{font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.track{position:relative;height:18px}
.track::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:var(--line);border-radius:2px}
.track .tk{position:absolute;top:4px;width:1px;height:10px;background:var(--line)}
.track .dot{position:absolute;top:3px;width:12px;height:12px;border-radius:50%;transform:translateX(-6px);border:2px solid var(--surface)}
.strip-axis{display:grid;grid-template-columns:120px minmax(0,1fr) 48px;gap:10px;padding-inline:6px;font-size:13px;color:var(--ink-3)}
.strip-axis div{display:flex;justify-content:space-between}
.bd{margin:2px 6px 10px 136px;display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--surface-2);border-radius:8px;font-size:14.5px}
@media (max-width:560px){.bd{margin-left:6px}}
.bd-list{display:flex;flex-wrap:wrap;gap:6px}
.bd-item{display:inline-flex;align-items:baseline;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:4px 9px}
.bd-item b{font-variant-numeric:tabular-nums}
.bd-item .sm{color:var(--ink-3);font-size:13.5px}
.bd-item.off{opacity:.7;border-style:dashed}
.bd-f{color:var(--ink-2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bd-f strong{color:var(--ink)}
tr.bd-row td{background:var(--surface);white-space:normal;text-align:left;padding:0}
tr.bd-row .bd{margin:6px 0 10px}
.strip-row .chev{font-size:12px;color:var(--ink-3);width:10px;flex:none;transition:transform .15s}
.strip-row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.strip-row .val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.chart{position:relative;min-width:0}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--f-body);font-size:13.5px;fill:var(--ink-3)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart text.vlab{fill:var(--ink);font-weight:700}
.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin-bottom:6px}
.legend button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 10px;font-size:14px;cursor:pointer}
.legend button[aria-pressed="false"]{opacity:.45}
.legend button[aria-pressed="false"] .sw{background:transparent!important;outline:1.5px solid var(--ink-3)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.12);min-width:120px;z-index:3}
.tip b{display:block;margin-bottom:4px}
.tip div{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip div span:first-child{display:flex;align-items:center;gap:6px}
.chart-cap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:14.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);font-weight:600}
.mock-now{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mock-cell{background:var(--surface-2);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline}
.mock-cell .a{font-size:14.5px;color:var(--ink-2)}
.mock-cell .g{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mock-cell .g small{font-size:13px;font-weight:500;color:var(--ink-3);margin-left:1px}

.verdict{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:15px}
.ctrl{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.ctrl label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--ink-2);font-weight:600}
.ctrl select,.ctrl input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:110px;font-weight:500}
.ctrl input{width:110px;min-width:0}
ul.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.essay{font-size:15.5px;line-height:1.75;background:var(--surface-2);border-radius:8px;padding:12px 14px;margin:0;white-space:pre-wrap;user-select:text}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14.5px;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qs label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.qs input{margin-top:4px}
.detail{display:flex;flex-direction:column;gap:10px}
.detail .formula{font-size:14.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px;color:var(--ink-2);overflow-wrap:anywhere}
.detail .big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}}
table.plan select,table.plan input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:15px}
table.plan input[type=text]{width:100%;min-width:120px}
table.plan td{vertical-align:middle}
.btn.xs{padding:3px 8px;font-size:14px;font-weight:500}
.qi{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qb{display:flex;flex-direction:column;gap:4px}
.qtag{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qev{font-size:14px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.qq{font-weight:500}
.qfix{display:flex;gap:8px;align-items:baseline;color:var(--ink-2)}

.ach-A{color:var(--hi);border-color:var(--hi);background:var(--hi-soft)}
td.hi{color:var(--hi);font-weight:700}
.mtab td,.mtab th{text-align:center}
.mtab td:first-child,.mtab th:first-child{text-align:left}
.mtab th.grp{text-align:center;font-size:14px;color:var(--ink)}

.mtab .t2{background:var(--t2-bg)}
.mtab th.t1,.mtab th.t2{color:var(--ink)}

.mtab td.mt{font-weight:700;font-size:16px;text-align:center}
.mtab th.t1,.mtab th.t2{text-align:center}
.mtab td.tq{color:var(--ink-2);font-weight:600;font-size:15px}
.mtab td.tg{outline:2px solid currentColor;outline-offset:-3px;border-radius:4px}
.mlab{padding:2px 8px;border-radius:6px}

.mlab.t2{background:var(--t2-bg)}

.rktab td.rk-c{font-weight:700;vertical-align:top}

.h2chk{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;padding:3px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}

.cntab em.up{color:var(--up)}
.cntab em.down{color:var(--down)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
"use strict";
/* ───────── 기본 유틸 ───────── */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=h=>h==null?"":String(h).replace(/\s+/g,"").toUpperCase();
const txt=v=>v==null?"":String(v).trim();
function num(v){if(v==null||v==="")return null;if(typeof v==="number")return isFinite(v)?v:null;const s=String(v).trim().replace(/,/g,"");return /^-?\d+(\.\d+)?$/.test(s)?Number(s):null}
function grd(v){const n=num(v);return n!=null&&Number.isInteger(n)&&n>=1&&n<=9?n:null}
const r2=x=>Math.round((x+1e-9)*100)/100;
const f2=x=>x==null?"–":r2(x).toFixed(2);
const ro=v=>/[036]$/.test(String(v))?"으로":"로";
const fv=x=>x==null?"–":(Number.isInteger(x)?String(x):String(r2(x)));
function wavg(list){let sc=0,sg=0;for(const r of list){sc+=r.credit;sg+=r.g*r.credit}return sc?sg/sc:null}

const SUBJ_FIRST=["국어","수학","영어","사회","과학"];
const SUBJ_COLOR={국어:1,수학:2,영어:3,사회:4,과학:5,생활교양:6,예체능:7,교양:8,기타:8};
const MOCK_LIMIT=4; /* 모의고사는 성적이 있는 회차 중 가장 최근 4회만 분석 */
const AREA_ORDER=["국어","수학","영어","한국사","통합사회","통합과학"];
const AREA_COLOR={국어:1,수학:2,영어:3,통합사회:4,통합과학:5,한국사:7};
const colorOf=(map,name,i)=>`var(--s${map[name]||((i%8)+1)})`;

/* ───────── 시트 해석 ───────── */
function tbl(aoa){if(!aoa||!aoa.length)return null;const H=(aoa[0]||[]).map(norm);const rows=aoa.slice(1).filter(r=>r&&r.some(v=>v!=null&&String(v).trim()!==""));return{H,rows}}
function ci(H,...names){for(const n of names){const i=H.indexOf(norm(n));if(i>=0)return i}return -1}
const gv=(r,i)=>i<0||r[i]===undefined?null:r[i];
function mode(arr){const m=new Map();for(const v of arr)if(v!=null)m.set(v,(m.get(v)||0)+1);let b=null,c=0;for(const[k,n]of m)if(n>c){b=k;c=n}return b}

function build(sheets,fileName,isSample){
  const rep={warn:[],info:[],mocks:[]};
  const names=Object.keys(sheets);
  const find=n=>names.find(x=>norm(x)===norm(n));
  /* 과목목록: 과목명 열과 그 왼쪽의 교과군 열을 짝으로 읽음 */
  const subjMap=new Map();let groupOrder=[];
  const sl=find("과목목록");
  if(sl){const a=sheets[sl];const H=(a[0]||[]).map(norm);const pi=H.indexOf(norm("과목명"));let gi=-1;
    if(pi>0)for(let k=pi-1;k>=0;k--)if(H[k]===norm("교과군")||H[k]===norm("교과")){gi=k;break}
    if(pi>=0&&gi>=0)for(const r of a.slice(1)){const s=txt(r[pi]),g=txt(r[gi]);if(s&&g)subjMap.set(norm(s),g)}
    const g0=H.indexOf(norm("교과군"));
    if(g0>=0&&g0!==gi)groupOrder=a.slice(1).map(r=>txt(r[g0])).filter(Boolean);
    else groupOrder=[...new Set(subjMap.values())];
  }else rep.warn.push("과목목록 시트가 없습니다. 내신 시트의 교과군 열만 사용합니다.");

  /* 학생정보 */
  const students=new Map();const nameIdx=new Map();
  const si=find("학생정보");
  if(si){const t=tbl(sheets[si]);if(t){const c={id:ci(t.H,"학생ID"),nm:ci(t.H,"이름","성명"),gr:ci(t.H,"현재학년","학년"),cl:ci(t.H,"현재반","반"),no:ci(t.H,"현재번호","번호"),st:ci(t.H,"재학상태","상태")};
    for(const r of t.rows){const id=txt(gv(r,c.id)),nm=txt(gv(r,c.nm));if(!id||!nm)continue;
      students.set(id,{id,name:nm,grade:num(gv(r,c.gr)),cls:num(gv(r,c.cl)),no:num(gv(r,c.no)),status:txt(gv(r,c.st)),hist:[]})}}}
  else rep.warn.push("학생정보 시트가 없어 내신·모의 시트의 이름으로 학생 목록을 만들었습니다.");
  for(const s of students.values()){const a=nameIdx.get(s.name)||[];a.push(s.id);nameIdx.set(s.name,a)}
  const link={byName:0,unmatched:0,added:0};
  function resolve(idv,nmv,r,c){let id=txt(idv);const nm=txt(nmv);
    if(!id&&nm){const ids=nameIdx.get(nm);if(ids&&ids.length===1){link.byName++;id=ids[0]}else{link.unmatched++;return null}}
    if(!id)return null;
    if(!students.has(id)){students.set(id,{id,name:nm||id,grade:num(gv(r,c.gr)),cls:num(gv(r,c.cl)),no:num(gv(r,c.no)),status:"",hist:[]});link.added++;
      const a=nameIdx.get(nm||id)||[];a.push(id);nameIdx.set(nm||id,a)}
    return id}

  /* 재학이력 */
  const hi=find("재학이력");
  if(hi){const t=tbl(sheets[hi]);if(t){const c={yr:ci(t.H,"학년도"),gr:ci(t.H,"학년"),cl:ci(t.H,"반"),no:ci(t.H,"번호"),nm:ci(t.H,"이름"),id:ci(t.H,"학생ID")};
    for(const r of t.rows){if(!txt(gv(r,c.nm))&&!txt(gv(r,c.id)))continue;const id=resolve(gv(r,c.id),gv(r,c.nm),r,c);if(!id)continue;
      students.get(id).hist.push({year:num(gv(r,c.yr)),grade:num(gv(r,c.gr)),cls:num(gv(r,c.cl)),no:num(gv(r,c.no))})}}}

  /* 내신 */
  const naesin=new Map();let maxG=0,nRows=0,badChk=0,noKey=0;const unknownSubj=new Set();const semSeen=new Map();
  const ni=find("내신");
  if(ni){const t=tbl(sheets[ni]);if(t){const c={yr:ci(t.H,"학년도"),se:ci(t.H,"학기"),gr:ci(t.H,"학년"),cl:ci(t.H,"반"),no:ci(t.H,"번호"),nm:ci(t.H,"이름","성명"),grp:ci(t.H,"교과군","교과"),sub:ci(t.H,"과목명","과목"),cr:ci(t.H,"학점","이수학점","단위수"),ach:ci(t.H,"성취도"),gd:ci(t.H,"등급","석차등급"),raw:ci(t.H,"원점수"),id:ci(t.H,"학생ID"),chk:ci(t.H,"입력확인")};
    const miss=[["학기",c.se],["학년",c.gr],["과목명",c.sub],["학점",c.cr],["등급",c.gd]].filter(x=>x[1]<0).map(x=>x[0]);
    if(miss.length)rep.warn.push(`내신 시트에서 필요한 열을 찾지 못했습니다: ${miss.join(", ")}`);
    for(const r of t.rows){const sub=txt(gv(r,c.sub));if(!sub)continue;
      const chk=txt(gv(r,c.chk));if(c.chk>=0&&chk&&chk!=="정상")badChk++;
      const id=resolve(gv(r,c.id),gv(r,c.nm),r,c);if(!id)continue;
      const gr=num(gv(r,c.gr)),se=num(gv(r,c.se));if(gr==null||se==null){noKey++;continue}
      let grp=txt(gv(r,c.grp));if(!grp)grp=subjMap.get(norm(sub))||"";if(!grp){unknownSubj.add(sub);grp="기타"}
      const rec={year:num(gv(r,c.yr)),grade:gr,sem:se,subject:sub,group:grp,credit:num(gv(r,c.cr)),ach:txt(gv(r,c.ach)),raw:num(gv(r,c.raw)),g:grd(gv(r,c.gd))};
      if(rec.g!=null&&rec.g>maxG)maxG=rec.g;
      if(!naesin.has(id))naesin.set(id,[]);naesin.get(id).push(rec);nRows++;
      const sk=`${rec.year??""}학년도 ${gr}학년 ${se}학기`;semSeen.set(sk,(semSeen.get(sk)||0)+1)}}}
  else rep.warn.push("내신 시트가 없습니다.");

  /* 모의_* */
  const mocks=[];
  for(const sn of names.filter(n=>/^모의_/.test(n.trim()))){const t=tbl(sheets[sn]);if(!t)continue;
    const c={yr:ci(t.H,"시행연도","연도","학년도"),mo:ci(t.H,"시행월","월"),gr:ci(t.H,"학년"),cl:ci(t.H,"반"),no:ci(t.H,"번호"),nm:ci(t.H,"이름","성명"),ar:ci(t.H,"영역","과목"),raw:ci(t.H,"원점수"),std:ci(t.H,"표준점수"),pct:ci(t.H,"백분위"),gd:ci(t.H,"등급"),id:ci(t.H,"학생ID"),chk:ci(t.H,"입력확인")};
    const rows=new Map();let bad=0;const ys=[],ms=[],gs=[];
    for(const r of t.rows){const ar=txt(gv(r,c.ar));if(!ar)continue;const chk=txt(gv(r,c.chk));if(c.chk>=0&&chk&&chk!=="정상")bad++;
      const id=resolve(gv(r,c.id),gv(r,c.nm),r,c);if(!id)continue;
      ys.push(num(gv(r,c.yr)));ms.push(num(gv(r,c.mo)));gs.push(num(gv(r,c.gr)));
      if(!rows.has(id))rows.set(id,new Map());
      rows.get(id).set(ar,{raw:num(gv(r,c.raw)),std:num(gv(r,c.std)),pct:num(gv(r,c.pct)),g:grd(gv(r,c.gd))})}
    let n=0;for(const am of rows.values())if([...am.values()].some(x=>x.g!=null))n++;
    const m={sheet:sn,year:mode(ys),month:mode(ms),level:mode(gs),rows,n};mocks.push(m);
    rep.mocks.push({sheet:sn,label:mockName(m),n,bad})}
  mocks.sort((a,b)=>(a.year??0)-(b.year??0)||(a.month??0)-(b.month??0)||a.sheet.localeCompare(b.sheet));
  rep.mocks.sort((a,b)=>mocks.findIndex(m=>m.sheet===a.sheet)-mocks.findIndex(m=>m.sheet===b.sheet));

  if(!ni&&!mocks.length)throw new Error(`내신 시트와 모의_ 시트를 찾지 못했습니다. 이 파일의 시트: ${names.join(", ")}`);
  if(badChk)rep.warn.push(`내신 시트에서 입력확인이 '정상'이 아닌 행 ${badChk}개`);
  for(const m of rep.mocks)if(m.bad)rep.warn.push(`${m.sheet}에서 입력확인이 '정상'이 아닌 행 ${m.bad}개`);
  if(link.byName)rep.warn.push(`학생ID가 비어 있어 이름으로 연결한 행 ${link.byName}개`);
  if(link.unmatched)rep.warn.push(`학생ID가 없고 이름으로도 한 명을 특정할 수 없어 제외한 행 ${link.unmatched}개`);
  if(link.added)rep.warn.push(`학생정보에 없는 학생ID ${link.added}명을 성적 시트 기준으로 추가`);
  if(noKey)rep.warn.push(`학년 또는 학기가 비어 제외한 내신 행 ${noKey}개`);
  if(unknownSubj.size)rep.warn.push(`교과군을 찾지 못해 '기타'로 분류한 과목: ${[...unknownSubj].join(", ")}`);
  rep.info.push(`학생 ${students.size}명`);
  rep.info.push(`내신 ${nRows}행 · ${[...semSeen.keys()].join(", ")||"자료 없음"}`);
  return{fileName,isSample,students,naesin,mocks,groupOrder,gradeMax:maxG>5?9:5,rep}
}
function mockName(m){return m.month!=null?`${m.year!=null?m.year+"년 ":""}${m.month}월`:m.sheet}

/* ───────── 학생 분석 ───────── */
function analyze(id){
  const st=DB.students.get(id);
  const rows=DB.naesin.get(id)||[];
  const semMap=new Map();
  for(const r of rows){const k=`${r.grade}|${r.sem}|${r.year??""}`;if(!semMap.has(k))semMap.set(k,{grade:r.grade,sem:r.sem,year:r.year,rows:[]});semMap.get(k).rows.push(r)}
  const sems=[...semMap.values()].sort((a,b)=>a.grade-b.grade||a.sem-b.sem||(a.year??0)-(b.year??0));
  const cnt=new Map();for(const s of sems){const k=`${s.grade}-${s.sem}`;cnt.set(k,(cnt.get(k)||0)+1)}
  const acc=[];
  for(const s of sems){const dup=cnt.get(`${s.grade}-${s.sem}`)>1;
    s.label=`${s.grade}-${s.sem}`+(dup?`(${s.year})`:"");s.long=`${s.grade}학년 ${s.sem}학기`+(dup?` (${s.year}학년도)`:"");
    s.graded=s.rows.filter(r=>r.g!=null&&r.credit>0);
    s.avg=wavg(s.graded);acc.push(...s.graded);s.cum=wavg(acc);
    s.credTotal=s.rows.reduce((p,r)=>p+(r.credit>0?r.credit:0),0);s.credGraded=s.graded.reduce((p,r)=>p+r.credit,0);
    for(const r of s.rows)r.semLabel=s.label}
  const semsV=sems.filter(s=>s.avg!=null);
  const gset=new Set();for(const s of sems)for(const r of s.graded)gset.add(r.group);
  const order=[...SUBJ_FIRST,...DB.groupOrder.filter(g=>!SUBJ_FIRST.includes(g))];
  const groups=[...gset].sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  const subjSem={},subjCum={};
  for(const g of groups){subjSem[g]=sems.map(s=>wavg(s.graded.filter(r=>r.group===g)));subjCum[g]=wavg(acc.filter(r=>r.group===g))}
  /* 모의 */
  const inc=[],exc=[];
  for(const m of DB.mocks){const am=m.rows.get(id);if(am&&[...am.values()].some(x=>x.g!=null))inc.push({m,areas:am});else exc.push(m)}
  const older=inc.length>MOCK_LIMIT?inc.splice(0,inc.length-MOCK_LIMIT):[];
  const multiYear=new Set(inc.map(x=>x.m.year)).size>1;
  for(const x of inc){x.label=x.m.month!=null?(multiYear?`${String(x.m.year).slice(-2)}년 ${x.m.month}월`:`${x.m.month}월`):x.m.sheet;x.min=minCalc(x.areas)}
  const areaSet=new Set();for(const x of inc)for(const[a,v]of x.areas)if(v.g!=null||v.pct!=null)areaSet.add(a);
  const areas=[...areaSet].sort((a,b)=>{const ia=AREA_ORDER.indexOf(a),ib=AREA_ORDER.indexOf(b);return(ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b)});
  return{st,sems,semsV,groups,subjSem,subjCum,allGraded:acc,mocks:inc,mockExcluded:exc,mockOlder:older,areas}
}
function minCalc(a){const G=n=>a.get(n)?.g??null;const k=G("국어"),m=G("수학"),e=G("영어"),s=G("통합사회"),c=G("통합과학");
  const miss=[["국어",k],["수학",m],["영어",e],["통합사회",s],["통합과학",c]].filter(x=>x[1]==null).map(x=>x[0]);
  if(miss.length)return{miss};
  const t1=Math.min(s,c),t2=Math.floor((s+c)/2);
  const sums=t=>{const v=[k,m,e,t].sort((x,y)=>x-y);return{2:v[0]+v[1],3:v[0]+v[1]+v[2],4:v[0]+v[1]+v[2]+v[3],sorted:v}};
  return{k,m,e,s,c,t1,t2,S:{t1:sums(t1),t2:sums(t2)}}}

/* ───────── 목표 최저기준 (브라우저별 편의 저장) ───────── */
let T={method:"t1",n:3,goal:7};
try{const s=JSON.parse(localStorage.getItem("gw.target")||"null");if(s&&["t1","t2"].includes(s.method)&&[2,3,4].includes(s.n)&&s.goal>0)T=s}catch(e){}
function saveT(){try{localStorage.setItem("gw.target",JSON.stringify(T))}catch(e){}}
const mName=m=>m==="t1"?"탐구1":"탐구2";
/* 탐구1·탐구2 두 방식 모두 판정 (m 생략 시 탐구1) */
function judge(x,m="t1"){if(!x.min||x.min.miss)return null;const v=x.min.S[m][T.n];return{v,ok:v<=T.goal}}
const okTxt=j=>j.ok?"⟦충족⟧":"⟦미충족⟧";
function bothTxt(a,b){return a.ok&&b.ok?"두 방식 모두 충족":!a.ok&&!b.ok?"두 방식 모두 미충족":a.ok?"탐구1 기준만 충족":"탐구2 기준만 충족"}
function streak(A,m="t1"){let n=0;for(let i=A.mocks.length-1;i>=0;i--){const j=judge(A.mocks[i],m);if(!j)break;if(j.ok)n++;else break}return n}

/* ───────── 문장 생성 (계산 결과만 사용) ───────── */
/* 등급은 숫자가 작을수록 좋으므로 값이 줄면 '상승' */
function dir(prev,cur){const d=r2(cur)-r2(prev);return d<0?"상승":d>0?"하락":"유지"}
const tg=w=>`⟦${w}⟧`; /* 문장 안 방향 표시 → mark()에서 색 입힘 */
function mark(s){return esc(s).replace(/⟦(상승|하락|유지|미충족|충족)⟧/g,(m,w)=>w==="충족"?`<b class="mk-ok">충족</b>`:w==="미충족"?`<b class="mk-no">미충족</b>`:`<b class="dir ${w==="상승"?"up":w==="하락"?"down":"same"}">${w}</b>`)}
function insights(A){
  const out=[];const S=A.semsV;
  if(S.length===1)out.push(`아직 한 학기(${S[0].long})의 성적만 있어 학기 간 성적 변화는 분석하지 않습니다. 현재 학기 평균내신은 ${f2(S[0].avg)}입니다.`);
  if(S.length>=2){const a=S[S.length-2],b=S[S.length-1];const d=dir(a.avg,b.avg),d2=dir(a.cum,b.cum);
    out.push(`최근 학기 평균내신: ${a.label} ${f2(a.avg)} → ${b.label} ${f2(b.avg)} ${tg(d)}`);
    out.push(`누적 평균내신: ${f2(a.cum)} → ${f2(b.cum)} ${tg(d2)}`)}
  let big=null;
  for(const g of A.groups){const seq=A.sems.map((s,i)=>({l:s.label,v:A.subjSem[g][i]})).filter(x=>x.v!=null);
    if(seq.length>=3){const l3=seq.slice(-3).map(x=>r2(x.v));
      if(l3[0]>l3[1]&&l3[1]>l3[2])out.push(`${g} 교과: 최근 3개 학기 연속 ${tg("상승")} (${l3.map(v=>v.toFixed(2)).join(" → ")})`);
      else if(l3[0]<l3[1]&&l3[1]<l3[2])out.push(`${g} 교과: 최근 3개 학기 연속 ${tg("하락")} (${l3.map(v=>v.toFixed(2)).join(" → ")})`)}
    if(seq.length>=2){const p=seq[seq.length-2],q=seq[seq.length-1];const d=Math.abs(r2(q.v)-r2(p.v));if(d>0&&(!big||d>big.d))big={g,p,q,d}}}
  if(big)out.push(`직전 학기 대비 변화가 가장 큰 교과: ${big.g} ${big.p.l} ${f2(big.p.v)} → ${big.q.l} ${f2(big.q.v)} ${tg(dir(big.p.v,big.q.v))}`);
  const M=A.mocks;
  if(!M.length)out.push("입력된 모의고사 성적이 없습니다.");
  if(M.length===1)out.push(`모의고사 성적이 한 회차(${M[0].label})만 있어 회차 간 변화는 분석하지 않습니다.`);
  if(M.length>=2){const f=M[0],l=M[M.length-1];const up=[],dn=[];
    for(const a of A.areas){const x=f.areas.get(a)?.g,y=l.areas.get(a)?.g;if(x==null||y==null)continue;if(y<x)up.push(`${a}(${x}→${y})`);else if(y>x)dn.push(`${a}(${x}→${y})`)}
    if(up.length)out.push(`모의고사 ${f.label} → ${l.label} ${tg("상승")}: ${up.join(", ")}`);
    if(dn.length)out.push(`모의고사 ${f.label} → ${l.label} ${tg("하락")}: ${dn.join(", ")}`);
    if(!up.length&&!dn.length)out.push(`모의고사 ${f.label} → ${l.label}: 모든 영역 ${tg("유지")}`)}
  if(M.length){const l=M[M.length-1];const j=judge(l);
    if(j){const j2=judge(l,"t2");out.push(`최근 모의고사(${l.label}) ${T.n}합: 탐구1 ${j.v}(${okTxt(j)}) · 탐구2 ${j2.v}(${okTxt(j2)}) / 목표 ${T.goal} 이하`)}
    else out.push(`최근 모의고사(${l.label})는 ${l.min.miss.join(", ")} 등급이 없어 최저기준을 계산하지 않았습니다.`);
    for(const m of ["t1","t2"]){const sk=streak(A,m);if(sk>=2)out.push(`${mName(m)} 기준 최근 ${sk}회 연속 목표 최저기준을 ⟦충족⟧했습니다.`)}
    const js=M.map(x=>judge(x)).filter(Boolean),js2=M.map(x=>judge(x,"t2")).filter(Boolean);if(js.length)out.push(`${A.mockOlder.length?`최근 ${MOCK_LIMIT}회 중 `:""}계산 가능한 ${js.length}회 중 충족 횟수: 탐구1 ${js.filter(j=>j.ok).length}회 · 탐구2 ${js2.filter(j=>j.ok).length}회`)}

const eul=v=>/[013678]$/.test(String(v))?"을":"를";
const said=w=>w==="유지"?`${tg("유지")}했습니다`:`${tg(w)}했습니다`;
/* 분석문에 쓰는 최저 참고 기준 (합, 목표, 대상) */
const ESSAY_MIN=[["메디컬",[[4,5],[3,4]]],["서울 주요대학",[[4,8],[3,7]]],["지거국",[[2,8]]]];
function essay(A){
  const p=[];const S=A.semsV;
  if(S.length===1){const b=S[0];p.push(`현재 학기(${b.long}) 평균내신은 ${f2(b.avg)}이며, 아직 한 학기의 성적만 있어 학기 간 변화는 분석하지 않습니다.`)}
  if(S.length>=2){const a=S[S.length-2],b=S[S.length-1];
    const d1=dir(a.avg,b.avg);p.push(d1==="유지"?`최근 학기(${b.long}) 평균내신은 ${f2(b.avg)}${ro(f2(b.avg))}, 이전 학기(${a.label})와 같은 수준을 ${said("유지")}.`:`최근 학기(${b.long}) 평균내신은 ${f2(b.avg)}${ro(f2(b.avg))}, 이전 학기(${a.label} ${f2(a.avg)})보다 ${said(d1)}.`);
    const d2=dir(a.cum,b.cum);p.push(d2==="유지"?`누적 평균내신은 ${f2(b.cum)}${eul(f2(b.cum))} ${said("유지")}.`:`누적 평균내신은 ${f2(b.cum)}${ro(f2(b.cum))}, 이전 시점(${f2(a.cum)})보다 ${said(d2)}.`);
    for(const g of A.groups){const seq=A.sems.map((s,i)=>({s,v:A.subjSem[g][i]})).filter(x=>x.v!=null);if(seq.length<2)continue;
      const x=seq[seq.length-2],y=seq[seq.length-1];
      const w=dir(x.v,y.v);p.push(w==="유지"?`${g} 교과는 ${f2(y.v)}${eul(f2(y.v))} ${said("유지")} (${x.s.label} → ${y.s.label}).`:`${g} 교과는 ${x.s.label} ${f2(x.v)}에서 ${y.s.label} ${f2(y.v)}${ro(f2(y.v))} ${said(w)}.`)}}
  const M=A.mocks;
  if(M.length){const l=M[M.length-1];const parts=A.areas.map(a=>{const v=l.areas.get(a)?.g;return v!=null?`${a} ${v}등급`:null}).filter(Boolean);
    p.push(`최근 모의고사(${l.label})에서 ${parts.join(", ")}을 받았습니다.`);
    if(M.length>=2){const pv=M[M.length-2];const ch=A.areas.map(a=>{const x=pv.areas.get(a)?.g,y=l.areas.get(a)?.g;if(x==null||y==null)return null;const w=y<x?"상승":y>x?"하락":"유지";return`${a} ${tg(w)}${w==="유지"?"":`(${x}→${y})`}`}).filter(Boolean);
      if(ch.length)p.push(`직전 회차(${pv.label}) 대비 ${ch.join(", ")}.`)}
    /* 분석문 최저 설명: 4합 → 3합 → 2합 순, 고정 참고 기준 */
    if(l.min&&!l.min.miss){p.push(`최근 모의고사(${l.label}) 최저기준 충족 여부는 다음과 같습니다.`);
      for(const[lab,cs]of ESSAY_MIN){p.push(`· ${lab} (${cs.map(([k,g])=>`${k}합 ${g}`).join(" / ")})`);
        for(const[k,g]of cs){const v1=l.min.S.t1[k],v2=l.min.S.t2[k];p.push(`   ${k}합 ${g} 이하 — 탐구1: ${v1} ${tg(v1<=g?"충족":"미충족")} · 탐구2: ${v2} ${tg(v2<=g?"충족":"미충족")}`)}}}
    else if(l.min)p.push(`최근 모의고사(${l.label})는 ${l.min.miss.join(", ")} 등급이 없어 최저기준을 계산하지 않았습니다.`)}
  return p.join("\n")}

const RO=("ResizeObserver" in window)?new ResizeObserver(es=>{for(const e of es){const h=e.target;if(h._w!==Math.round(h.clientWidth))drawChart(h)}}):null;
function chart(host,spec){host._spec=spec;host._hidden=host._hidden||new Set();drawChart(host);if(RO)RO.observe(host)}
function drawChart(host){
  const sp=host._spec;if(!sp)return;const W=Math.max(260,Math.round(host.clientWidth||600));host._w=W;const H=sp.height||240;
  const m={l:42,r:14,t:12,b:32},pw=W-m.l-m.r,ph=H-m.t-m.b,n=sp.cats.length;
  const X=i=>m.l+pw*(i+.5)/n;const Y=v=>sp.invert?m.t+(v-sp.yMin)/(sp.yMax-sp.yMin)*ph:m.t+(sp.yMax-v)/(sp.yMax-sp.yMin)*ph;
  const vis=sp.series.filter(s=>!host._hidden.has(s.name));
  let leg="";
  if(sp.series.length>1)leg=`<div class="legend">${sp.series.map(s=>`<button type="button" data-s="${esc(s.name)}" aria-pressed="${!host._hidden.has(s.name)}"><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</button>`).join("")}</div>`;
  let g="";
  for(const t of sp.ticks)g+=`<line class="grid" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${t}</text>`;
  sp.cats.forEach((c,i)=>{g+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle">${esc(c)}</text>`});
  for(const s of vis){let d="",pen=false;s.values.forEach((v,i)=>{if(v==null){pen=false;return}d+=`${pen?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`;pen=true});
    g+=`<path d="${d}" style="fill:none;stroke:${s.color};stroke-width:2;stroke-linejoin:round;stroke-linecap:round"${s.dash?` stroke-dasharray="5 4"`:""}/>`;
    s.values.forEach((v,i)=>{if(v!=null){g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" style="fill:${s.color};stroke:var(--surface);stroke-width:2"/>`;if(sp.labels)g+=`<text x="${X(i)}" y="${Y(v)-10}" text-anchor="middle" class="vlab">${sp.fmt(v)}</text>`}})}
  g+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ph}" visibility="hidden"/>`;
  g+=`<rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" style="fill:transparent"/>`;
  host.innerHTML=`${leg}<div style="position:relative"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(sp.aria||"")}">${g}</svg><div class="tip" hidden></div></div>`;
  host.querySelectorAll(".legend button").forEach(b=>b.onclick=()=>{const nm=b.dataset.s;if(host._hidden.has(nm))host._hidden.delete(nm);else if(sp.series.length-host._hidden.size>1)host._hidden.add(nm);drawChart(host)});
  const svg=host.querySelector("svg"),tip=host.querySelector(".tip"),xh=svg.querySelector(".xh");
  const move=ev=>{const rc=svg.getBoundingClientRect();const x=ev.clientX-rc.left;let i=Math.floor((x-m.l)/pw*n);i=Math.max(0,Math.min(n-1,i));
    xh.setAttribute("x1",X(i));xh.setAttribute("x2",X(i));xh.setAttribute("visibility","visible");
    tip.innerHTML=`<b>${esc(sp.cats[i])}</b>`+vis.map(s=>`<div><span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span><span class="num">${s.values[i]==null?"–":sp.fmt(s.values[i])}</span></div>`).join("");
    tip.hidden=false;const tw=tip.offsetWidth;let left=X(i)+12;if(left+tw>W)left=X(i)-12-tw;tip.style.left=Math.max(0,left)+"px";tip.style.top=m.t+"px"};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);
  svg.addEventListener("pointerleave",()=>{tip.hidden=true;xh.setAttribute("visibility","hidden")});
}

/* 모의고사 분석 */
function paneMock(p,A){
  const M=A.mocks;
  if(!M.length){p.innerHTML=`<div style="padding-top:16px"><p class="msg">입력된 모의고사 성적이 없습니다.${A.mockExcluded.length?` (성적 미입력 회차: ${A.mockExcluded.map(m=>esc(mockName(m))).join(", ")})`:""}</p></div>`;return}
  const rowsOf=a=>{const R=[["원점수","raw"],["표준점수","std"],["백분위","pct"],["등급","g"]].filter(([,k])=>M.some(x=>x.areas.get(a)?.[k]!=null));
    return`<div class="tw"><table><thead><tr><th>${esc(a)}</th>${M.map(x=>`<th>${esc(x.label)}</th>`).join("")}</tr></thead><tbody>${R.map(([l,k])=>`<tr><td>${l}</td>${M.map(x=>{const v=x.areas.get(a)?.[k];return`<td${k==="g"?' style="font-weight:700"':""}>${v==null?"–":fv(v)}</td>`}).join("")}</tr>`).join("")}</tbody></table></div>`};
  p.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px;padding-top:16px">
  <section class="card"><div class="chart-cap"><h2>회차별 변화 <small>${MOCKMODE==="g"?"등급 · 1등급이 위쪽":"백분위 · 높을수록 위쪽"}</small></h2>
    <div class="seg" role="group" aria-label="표시 값"><button type="button" data-m="g" aria-pressed="${MOCKMODE==="g"}">등급</button><button type="button" data-m="p" aria-pressed="${MOCKMODE==="p"}">백분위</button></div></div>
    ${M.length>=2?`<div class="chart" id="m1"></div>`:`<p class="msg">모의고사 성적이 한 회차만 있어 회차 간 변화는 분석하지 않습니다.</p>`}
    ${olderNote(A)}${A.mockExcluded.length?`<p class="note">성적이 입력되지 않아 제외한 회차: ${A.mockExcluded.map(m=>`${esc(m.sheet)}(${esc(mockName(m))})`).join(", ")}</p>`:""}
  </section>
  <section class="card"><h2>영역별 상세 <small>표준점수·백분위는 입력된 영역만 표시</small></h2>
    <div class="grid2">${A.areas.map(a=>`<div>${rowsOf(a)}</div>`).join("")}</div></section></div>`;
  if($("#m1"))mockChart($("#m1"),A,280,MOCKMODE);
  p.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{MOCKMODE=b.dataset.m;paneMock(p,A)})}

  const ids=studs.filter(s=>cur(s).grade===CN.grade).map(s=>s.id);const m=CN.m;

  const opt=(v,c,l)=>`<option value="${v}"${String(v)===String(c)?" selected":""}>${l}</option>`;
  const years=[...new Set(rows.map(r=>r.year))];
  let tb="";rows.forEach((r,i)=>{const pv=rows[i-1];
    tb+=`<tr${i===0||rows[i-1].year!==r.year?' class="rk-first"':""}><td>${esc(String(r.year))}</td><td>${esc(r.label)}</td><td>${r.n}${r.inp>r.n?`<span class="sub">입력 ${r.inp}</span>`:""}</td>${ks.map(k=>{const d=pv?r.ok[k]-pv.ok[k]:null;
      return`<td class="cn-v ${CN.m}"><b>${r.ok[k]}명</b><span class="sub">${pct(r.ok[k],r.n)}%${d==null?"":d>0?` · <em class="up">▲${d}</em>`:d<0?` · <em class="down">▼${-d}</em>`:" · 변동 없음"}</span></td>`}).join("")}</tr>`});
  p.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px;padding-top:16px">
  <section class="card"><h2>최저 인원 변화 <small>${CN.grade}학년 재학생 · 회차별 응시자 기준</small></h2>
    <div class="ctrl one">
      <label for="cnG">학년<select id="cnG">${grades.map(g=>opt(g,CN.grade,g+"학년")).join("")}</select></label>
      <label for="cnM">탐구 반영<select id="cnM">${opt("t1",CN.m,"탐구1")}${opt("t2",CN.m,"탐구2")}</select></label>
      <label for="cn2">2합 ≤<input id="cn2" type="number" min="2" max="18" value="${CN.g[2]}"></label>
      <label for="cn3">3합 ≤<input id="cn3" type="number" min="3" max="27" value="${CN.g[3]}"></label>
      <label for="cn4">4합 ≤<input id="cn4" type="number" min="4" max="36" value="${CN.g[4]}"></label>
      <label for="cnK">최저 기준<select id="cnK">${opt("all",CN.k,"2·3·4합 모두")}${[2,3,4].map(k=>opt(k,CN.k,k+"합")).join("")}</select></label></div>
    ${rows.length?`<div class="tw"><table class="mtab cntab"><thead><tr><th>연도</th><th>회차</th><th>응시자</th>${ks.map(k=>`<th class="${CN.m}">${k}합 충족 <small>(≤${CN.g[k]})</small></th>`).join("")}</tr></thead><tbody>${tb}</tbody></table></div>`:`<p class="msg">${CN.grade}학년 학생의 모의고사 성적이 없습니다.</p>`}
    <p class="note">응시자는 그 회차에 국어·수학·영어·통합사회·통합과학 등급이 모두 입력된 재학생입니다(일부만 입력된 학생은 '입력' 수로 따로 표시). 충족은 국어·수학·영어·탐구(${mName(CN.m)}) 등급 합이 목표 이하인 경우이며, ▲▼는 직전 회차 대비 충족 인원 변동입니다. 이 탭은 성적이 입력된 모든 회차를 보여 줍니다.</p></section>
  ${years.map((y,i)=>`<section class="card"><h2>${esc(String(y))}${typeof y==="number"?"년":""} 충족 인원 변동 <small>기준별 그래프 · 세로 눈금은 그래프마다 다름 · 응시자 수는 위 표 참고</small></h2><div class="cn-grid${ks.length===1?" one":""}">${ks.map(k=>`<div class="cn-mini"><h3><span class="sw" style="background:var(--s${k===2?1:k===3?2:3})"></span>${k}합 충족 <small>≤${CN.g[k]}</small></h3><div class="chart" id="cnc${i}_${k}"></div></div>`).join("")}</div></section>`).join("")}</div>`;

  const nice=mx=>{const st=mx<=5?1:mx<=10?2:mx<=25?5:mx<=60?10:mx<=150?25:50;const top=Math.max(st,Math.ceil((mx*1.15+0.01)/st)*st);return{st,top}};

function loadFile(f){
  if(!f)return;const rd=new FileReader();
  $("#report").innerHTML=`<span>${esc(f.name)} 읽는 중…</span>`;
  rd.onload=e=>{try{
      if(typeof XLSX==="undefined")throw new Error("엑셀 해석 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 페이지를 새로 고쳐 주세요.");
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});const sh={};
      for(const n of wb.SheetNames)sh[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true,blankrows:false});
      DB=build(sh,f.name,false);RCACHE=null;CUR=null;SEL=null;$("#q").value="";renderReport();renderResults();renderMain();$("#q").focus()
    }catch(err){$("#report").innerHTML=`<p class="err">파일을 읽지 못했습니다. ${esc(err.message||err)}</p>`;if(DB)setTimeout(renderReport,6000)}};
  rd.readAsArrayBuffer(f)}
